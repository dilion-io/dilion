name: Performance

# Sustained concurrency and latency of /auth/v1 with 100, 1k and 10k accounts
# (test/perf). Each account count is its own job, so the three run at once;
# the last job puts them side by side in the run summary.
#
# The server, Postgres and the load generator share one runner, so compare
# runs with each other rather than reading the numbers as a capacity plan.
on:
  push:
    paths: ['test/perf/**', '.github/workflows/perf.yml']
  workflow_dispatch:
    inputs:
      duration:
        description: Length of each concurrency step
        default: 15s
      levels:
        description: Concurrency steps, comma-separated
        default: 1,5,10,25,50,100,200,400,800
  schedule:
    - cron: '43 21 * * 0' # Mondays 06:43 Asia/Seoul

permissions:
  contents: read

jobs:
  load:
    name: Load (${{ matrix.accounts }} accounts)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        accounts: [100, 1000, 10000]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dilion
          POSTGRES_PASSWORD: dilion
          POSTGRES_DB: dilion_perf
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dilion -d dilion_perf"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DSN: postgres://dilion:dilion@localhost:5432/dilion_perf
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build server and load generator
        run: |
          go build -o "$RUNNER_TEMP/dilion" ./cmd/dilion
          go build -o "$RUNNER_TEMP/perf" ./test/perf

      # Per-IP rate limits are lifted: every request comes from 127.0.0.1, and
      # the point is the server's capacity, not the limiter's. Sign-ups are
      # confirmed at once so seeded accounts sign in straight away.
      - name: Start server
        env:
          DILION_DSN: ${{ env.DSN }}
          DILION_ADDR: ':8787'
          DILION_JWT_SECRET: perf-secret-perf-secret-perf-secret
          DILION_AUTH_MAILER_AUTOCONFIRM: 'true'
          DILION_AUTH_RATE_LIMIT_OTP: '1000000000'
          DILION_AUTH_RATE_LIMIT_TOKEN_REFRESH: '1000000000'
          DILION_AUTH_RATE_LIMIT_VERIFY: '1000000000'
          DILION_LOG_LEVEL: warn
        run: |
          export DILION_MASTER_KEY="$(head -c 32 /dev/urandom | base64)"
          nohup "$RUNNER_TEMP/dilion" > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -fs http://localhost:8787/auth/v1/health >/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/server.log"
          exit 1

      - name: Measure
        run: |
          {
            echo "## Load test: ${{ matrix.accounts }} accounts"
            echo
            echo "Runner: $(nproc) vCPU, $(free -g | awk '/Mem:/{print $2}') GB RAM"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          "$RUNNER_TEMP/perf" -dsn "$DSN" -url http://localhost:8787 \
            -accounts ${{ matrix.accounts }} \
            -levels '${{ inputs.levels || '1,5,10,25,50,100,200,400,800' }}' \
            -duration '${{ inputs.duration || '15s' }}' \
            -out "perf-${{ matrix.accounts }}.json" \
            -summary "$GITHUB_STEP_SUMMARY"

      - name: Server log
        if: always()
        run: tail -n 100 "$RUNNER_TEMP/server.log" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-${{ matrix.accounts }}
          path: perf-${{ matrix.accounts }}.json
          if-no-files-found: ignore

  summary:
    name: Compare account counts
    needs: load
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/download-artifact@v4
        with:
          pattern: perf-*
          merge-multiple: true

      - name: Summarize
        run: |
          files=$(ls perf-*.json 2>/dev/null | paste -sd, -)
          if [ -z "$files" ]; then
            echo "No load test produced a report." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          go run ./test/perf -combine "$files" -summary "$GITHUB_STEP_SUMMARY"
          go run ./test/perf -combine "$files"
