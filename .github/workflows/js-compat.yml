name: JS SDK compatibility

on:
  push:
    paths: ['js/**', 'internal/auth/**', 'migrations/01*.sql', 'go.mod', 'go.sum', '.github/workflows/js-compat.yml']
  pull_request:
    paths: ['js/**', 'internal/auth/**', 'migrations/01*.sql', 'go.mod', 'go.sum', '.github/workflows/js-compat.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 22 * * *' # Daily 07:17 Asia/Seoul

permissions:
  contents: read

jobs:
  server-http:
    name: OPAQUE SDK / Go HTTP / PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dilion
          POSTGRES_PASSWORD: dilion
          POSTGRES_DB: dilion_opaque_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dilion -d dilion_opaque_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - run: npm install --global pnpm@10.27.0
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: js
      - name: Real server lifecycle and SDK HTTP integration
        env:
          DILION_TEST_DB: postgres://dilion:dilion@localhost:5432/dilion_opaque_test
          DILION_OPAQUE_SDK_HTTP: '1'
        run: go test -race ./internal/auth -run '^TestOpaque' -count=1 -v
  compatibility:
    name: Auth / TypeScript (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        profile: [locked, latest-supabase, latest-supabase-and-typescript]
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.27.0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: js/packages/auth-js/test/interop/go.sum
      - run: pnpm install --frozen-lockfile
      # Produce the release declarations using the supported compiler FIRST;
      # the monitor then checks consumers against upstream's current releases.
      - run: pnpm build
      - name: Resolve current Supabase releases
        if: matrix.profile != 'locked'
        run: pnpm --filter @dilion-io/auth-js add @supabase/auth-js@latest @supabase/supabase-js@latest
      - name: Resolve current TypeScript release
        if: matrix.profile == 'latest-supabase-and-typescript'
        run: pnpm --filter @dilion-io/auth-js add --save-dev typescript@latest
      - name: Upstream-only control
        id: upstream
        continue-on-error: true
        run: pnpm --filter @dilion-io/auth-js compat:upstream
      # The gate for the canary profiles: our own sources, with third-party
      # declaration files left unchecked. See tsconfig.sources.json.
      - name: Dilion sources under the resolved compiler
        id: sources
        continue-on-error: true
        run: pnpm --filter @dilion-io/auth-js typecheck:sources
      - name: Dilion source and ESM/CJS consumer compatibility
        id: dilion
        continue-on-error: true
        run: pnpm typecheck
      - name: Runtime and Go interoperability
        id: runtime
        continue-on-error: true
        env:
          DILION_OPAQUE_GO_INTEROP: '1'
        run: pnpm test
      - name: Compatibility summary
        if: always()
        env:
          PROFILE: ${{ matrix.profile }}
          UPSTREAM: ${{ steps.upstream.outcome }}
          SOURCES: ${{ steps.sources.outcome }}
          DILION: ${{ steps.dilion.outcome }}
          RUNTIME: ${{ steps.runtime.outcome }}
        run: |
          {
            echo "## JS compatibility: $PROFILE"
            echo
            echo '| Check | Result | Gates this profile |'
            echo '| --- | --- | --- |'
            if [ "$PROFILE" = locked ]; then third_party=yes; else third_party='no (reported only)'; fi
            echo "| Supabase alone (strict declaration checking) | $UPSTREAM | $third_party |"
            echo "| Dilion sources alone (third-party declarations ignored) | $SOURCES | yes |"
            echo "| Dilion types, database inference, ESM/CJS exports | $DILION | $third_party |"
            echo "| Runtime / OPAQUE interoperability | $RUNTIME | yes |"
            echo
            echo 'If the upstream control fails, the problem also exists without Dilion.'
            echo 'A successful runtime check does not imply TypeScript compatibility.'
            echo 'On the latest-* profiles, strict declaration checking spans packages and a'
            echo 'compiler this repository does not pin, so it is reported rather than enforced;'
            echo 'the Dilion-sources and runtime checks are what turn those profiles red.'
            echo
            echo 'Resolved dependency versions:'
            echo '~~~text'
            pnpm --filter @dilion-io/auth-js list --depth 0
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      # Deliberately asymmetric. Do not "simplify" this back to requiring every
      # check on every profile.
      #
      # `locked` is the supported configuration: every version is pinned, so every
      # failure is reproducible and ours to act on, and all four checks gate.
      #
      # The latest-* profiles resolve @latest of packages, and of the compiler
      # itself, so strict declaration checking across that graph fails on other
      # people's release schedules. Both failures that appeared when TypeScript
      # 7.0 shipped were third-party and unfixable from this repository:
      # @supabase/auth-js's `PublicKeyCredentialFuture` contradicts the WebAuthn
      # Level 3 types that TS 7 added to lib.dom, and @types/chai vs vitest trip a
      # TS 7 change in how a method merges with a function-typed property
      # (microsoft/typescript-go#1192). Gating on those would hold this scheduled
      # job red until upstream moved, which is how a canary stops being read.
      # So they are reported, and the checks that can only fail because of our own
      # code -- Dilion sources and runtime -- carry the gate.
      - name: Enforce compatibility result
        if: always()
        env:
          PROFILE: ${{ matrix.profile }}
          UPSTREAM: ${{ steps.upstream.outcome }}
          SOURCES: ${{ steps.sources.outcome }}
          DILION: ${{ steps.dilion.outcome }}
          RUNTIME: ${{ steps.runtime.outcome }}
        run: |
          failed=0
          test "$SOURCES" = success ||
            { echo "::error::Dilion sources do not typecheck under the resolved compiler."; failed=1; }
          test "$RUNTIME" = success ||
            { echo "::error::Runtime or Go OPAQUE interoperability failed."; failed=1; }
          if [ "$PROFILE" = locked ]; then
            test "$UPSTREAM" = success ||
              { echo "::error::Pinned Supabase declarations fail strict checking."; failed=1; }
            test "$DILION" = success ||
              { echo "::error::Pinned dependency graph fails strict declaration checking."; failed=1; }
          else
            test "$UPSTREAM" = success ||
              echo "::warning::Upstream's current release fails strict declaration checking on its own, so this is not attributable to Dilion."
            test "$DILION" = success ||
              echo "::warning::Strict declaration checking failed somewhere in the resolved dependency graph; see the step log for which file reported the error, and the Dilion-sources row above for whether any of it is ours."
          fi
          exit "$failed"
