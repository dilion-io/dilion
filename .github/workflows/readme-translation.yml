name: Translate README

on:
  push:
    paths: ['README.md', 'scripts/translate-readme.mjs', 'scripts/translate-readme.test.mjs', '.github/workflows/readme-translation.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: readme-translation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  translate:
    # Never expose translation credentials to fork PRs or feature branches.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write # workload identity federation fallback
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
      - run: node --test scripts/translate-readme.test.mjs
      - name: Resolve translation credentials
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FEDERATION_JSON_TEMPLATE: ${{ secrets.ANTHROPIC_FEDERATION_JSON_TEMPLATE }}
          FEDERATION_AUDIENCE: "https://api.anthropic.com"
        run: |
          set -euo pipefail

          put_env() {
            # Heredoc form so a value can never be mistaken for another variable.
            { printf '%s<<__CREDENTIAL_EOF__\n%s\n__CREDENTIAL_EOF__\n' "$1" "$2"; } >> "$GITHUB_ENV"
          }

          # An explicit API key always wins; it also outranks federation inside the SDKs.
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            put_env ANTHROPIC_API_KEY "$ANTHROPIC_API_KEY"
            echo 'Authenticating with the ANTHROPIC_API_KEY secret.'
            exit 0
          fi

          if [ -z "$FEDERATION_JSON_TEMPLATE" ]; then
            echo '::error::Set the ANTHROPIC_API_KEY or ANTHROPIC_FEDERATION_JSON_TEMPLATE secret to enable README translation.'
            exit 1
          fi
          if ! printf '%s' "$FEDERATION_JSON_TEMPLATE" | jq -e 'type == "object"' > /dev/null; then
            echo '::error::ANTHROPIC_FEDERATION_JSON_TEMPLATE must be a JSON object holding the token-exchange request without "assertion".'
            exit 1
          fi
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo '::error::GitHub OIDC is unavailable; the job needs id-token: write.'
            exit 1
          fi

          # Mint the GitHub OIDC assertion the federation rule trusts.
          id_token_url="$ACTIONS_ID_TOKEN_REQUEST_URL"
          if [ -n "$FEDERATION_AUDIENCE" ]; then
            id_token_url="${id_token_url}&audience=$(jq -rn --arg a "$FEDERATION_AUDIENCE" '$a|@uri')"
          fi
          assertion="$(curl -sS --fail-with-body \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            -H 'Accept: application/json' \
            "$id_token_url" | jq -r '.value // empty')"
          if [ -z "$assertion" ]; then
            echo '::error::Could not mint a GitHub OIDC token for the federation exchange.'
            exit 1
          fi
          echo "::add-mask::$assertion"

          request="$(jq -nc \
            --argjson template "$FEDERATION_JSON_TEMPLATE" \
            --arg assertion "$assertion" \
            '$template + {assertion: $assertion}')"
          response="$(printf '%s' "$request" | curl -sS -X POST "https://api.anthropic.com/v1/oauth/token" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            --data-binary @-)"
          access_token="$(printf '%s' "$response" | jq -r '.access_token // empty')"
          if [ -z "$access_token" ]; then
            # Only the error fields are echoed; the raw body may carry credentials.
            echo "::error::Workload identity federation exchange failed: $(printf '%s' "$response" | jq -r '.error_description // .error.message? // .error // "unknown error"')"
            exit 1
          fi
          echo "::add-mask::$access_token"
          put_env ANTHROPIC_AUTH_TOKEN "$access_token"
          echo 'Authenticating with a federated access token.'
      - run: npm install --global @anthropic-ai/claude-code@2.1.263
      - name: Translate with claude -p
        env:
          # ANTHROPIC_API_KEY / ANTHROPIC_AUTH_TOKEN come from the resolve step via GITHUB_ENV.
          README_TRANSLATION_MODEL: ${{ vars.README_TRANSLATION_MODEL || 'sonnet' }}
          README_TRANSLATION_MAX_BUDGET_USD: '3'
        run: node scripts/translate-readme.mjs
      - name: Preserve generated document as artifact
        uses: actions/upload-artifact@v4
        with:
          name: readme-en
          path: README.en.md
          if-no-files-found: error
      - name: Commit only the generated English README
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- README.en.md
          if git diff --cached --quiet; then
            echo 'README.en.md is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: update generated English README'
          gh auth setup-git
          git pull --rebase origin "$DEFAULT_BRANCH"
          # Refuse stale output if the source changed while Claude was running.
          node scripts/translate-readme.mjs --check
          git push origin "HEAD:$DEFAULT_BRANCH"
