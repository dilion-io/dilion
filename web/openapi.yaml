components:
  schemas:
    APIKey:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        expires_at:
          format: date-time
          type:
            - string
            - "null"
        id:
          examples:
            - key_1f0c0b6a7d5e4a2b9c8d7e6f5a4b3c2d
          type: string
        last_used_at:
          format: date-time
          type:
            - string
            - "null"
        name:
          type:
            - string
            - "null"
        revoked_at:
          format: date-time
          type:
            - string
            - "null"
        scopes:
          items:
            type: string
          type: array
      required:
        - id
        - name
        - scopes
        - created_at
        - expires_at
        - revoked_at
        - last_used_at
      type: object
    APIKeyPage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/APIKey"
          type: array
        next_cursor:
          type:
            - string
            - "null"
      required:
        - items
        - next_cursor
      type: object
    APIKeyWithToken:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        expires_at:
          format: date-time
          type:
            - string
            - "null"
        id:
          examples:
            - key_1f0c0b6a7d5e4a2b9c8d7e6f5a4b3c2d
          type: string
        last_used_at:
          format: date-time
          type:
            - string
            - "null"
        name:
          type:
            - string
            - "null"
        revoked_at:
          format: date-time
          type:
            - string
            - "null"
        scopes:
          items:
            type: string
          type: array
        token:
          description: Plaintext API key. Shown once — store it now.
          examples:
            - dk_...
          type: string
      required:
        - token
        - id
        - name
        - scopes
        - created_at
        - expires_at
        - revoked_at
        - last_used_at
      type: object
    AudienceMember:
      additionalProperties: false
      properties:
        email:
          description: Auth email, empty string if the account has none, null when not requested.
          type:
            - string
            - "null"
        phone:
          description: Auth phone, empty string if the account has none, null when not requested.
          type:
            - string
            - "null"
        user_id:
          format: uuid
          type: string
      required:
        - user_id
        - email
        - phone
      type: object
    AudiencePage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/AudienceMember"
          type: array
        next_cursor:
          type:
            - string
            - "null"
      required:
        - items
        - next_cursor
      type: object
    AuditEvent:
      additionalProperties: false
      properties:
        access_level:
          description: masked | full | n/a.
          type:
            - string
            - "null"
        action:
          description: Recorded action, UPPER_SNAKE_CASE.
          examples:
            - PII_FULL_READ
          type: string
        actor_id:
          description: Operator or API key id, or null for system events.
          type:
            - string
            - "null"
        actor_type:
          description: admin | api_key | service_role | user | system.
          type:
            - string
            - "null"
        created_at:
          format: date-time
          type: string
        id:
          examples:
            - evt_1f0c0b6a7d5e4a2b9c8d7e6f5a4b3c2d
          type: string
        ip:
          type:
            - string
            - "null"
        reason:
          description: Operator-supplied justification (PII reveal 사유), or null.
          type:
            - string
            - "null"
        request_id:
          type:
            - string
            - "null"
        resource:
          description: Resource or route the action targeted.
          type:
            - string
            - "null"
        result_count:
          description: Number of records the action touched.
          format: int64
          type:
            - integer
            - "null"
        subject_ids:
          description: Subject manifest (§5.3). Returned by getAuditEvent; always empty in list responses.
          items:
            type: string
          type: array
        user_agent:
          type:
            - string
            - "null"
      required:
        - id
        - actor_id
        - actor_type
        - action
        - resource
        - access_level
        - request_id
        - result_count
        - reason
        - ip
        - user_agent
        - created_at
        - subject_ids
      type: object
    AuditEventPage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/AuditEvent"
          type: array
        next_cursor:
          description: Opaque cursor for the next page, or null.
          type:
            - string
            - "null"
      required:
        - items
        - next_cursor
      type: object
    ConsentState:
      additionalProperties: false
      properties:
        granted:
          description: Whether consent is currently granted.
          type: boolean
        policy_version:
          description: Policy version the consent was recorded against.
          type: string
        purpose:
          description: Consent purpose key.
          type: string
        reconfirm_due:
          description: When re-confirmation notice is due, or null.
          format: date-time
          type:
            - string
            - "null"
        updated_at:
          format: date-time
          type: string
      required:
        - purpose
        - granted
        - policy_version
        - updated_at
        - reconfirm_due
      type: object
    ConsentStatePage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/ConsentState"
          type: array
        next_cursor:
          description: "Always null: consent state is returned in full."
          type:
            - string
            - "null"
      required:
        - items
        - next_cursor
      type: object
    CreateAPIKeyBody:
      additionalProperties: false
      properties:
        expires_at:
          description: RFC 3339 expiry. Omit for a non-expiring key.
          format: date-time
          type: string
        name:
          description: Human-readable label.
          type: string
        scopes:
          description: Permissions this key may exercise (least privilege).
          items:
            type: string
          minItems: 1
          type: array
      required:
        - scopes
      type: object
    CreateDestinationBody:
      additionalProperties: false
      properties:
        config:
          additionalProperties: {}
          description: "Webhook: {url, identity_field}."
          type: object
        name:
          minLength: 1
          type: string
        secret:
          description: Webhook HMAC secret. Write-only, never returned.
          type: string
        type:
          enum:
            - WEBHOOK
            - CONNECTOR
          type: string
      required:
        - type
        - name
        - config
      type: object
    CreateLegalHoldBody:
      additionalProperties: false
      properties:
        basis:
          minLength: 1
          type: string
        domain:
          description: Data domain to hold. Omit to hold the whole subject.
          type: string
        reason:
          minLength: 1
          type: string
        user_id:
          format: uuid
          type: string
      required:
        - user_id
        - reason
        - basis
      type: object
    CreateMeRequestBody:
      additionalProperties: false
      properties:
        immediate:
          description: Skip the grace period (즉시 파기 요청, §2.9).
          type: boolean
        type:
          description: Request type.
          enum:
            - DELETION
            - EXPORT
            - CONSENT_WITHDRAWAL
          type: string
      required:
        - type
      type: object
    CreatePermissionBody:
      additionalProperties: false
      properties:
        name:
          description: Namespaced permission name, e.g. myapp.orders.refund. Builtin names are reserved.
          pattern: ^[a-z][a-z0-9-]*\.[a-z0-9.-]+$
          type: string
      required:
        - name
      type: object
    CreatePrivacyRequestBody:
      additionalProperties: false
      properties:
        immediate:
          description: Skip the grace period and schedule erasure immediately.
          type: boolean
        type:
          description: Request type.
          enum:
            - DELETION
            - EXPORT
            - CONSENT_WITHDRAWAL
          type: string
        user_id:
          description: Canonical user id of the data subject.
          format: uuid
          type: string
      required:
        - user_id
        - type
      type: object
    CreateRoleAssignmentBody:
      additionalProperties: false
      properties:
        actor_id:
          description: Operator or API key id receiving the role.
          minLength: 1
          type: string
      required:
        - actor_id
      type: object
    CreateRoleBody:
      additionalProperties: false
      properties:
        name:
          description: Unique role name within the project.
          minLength: 1
          type: string
        permissions:
          description: Permissions bundled by this role. Each must already be registered.
          items:
            type: string
          minItems: 1
          type: array
      required:
        - name
        - permissions
      type: object
    Destination:
      additionalProperties: false
      properties:
        config:
          additionalProperties: {}
          description: Type specific configuration. Secrets are never returned.
          type: object
        enabled:
          type: boolean
        id:
          examples:
            - dst_1f0c0b6a7d5e4a2b9c8d7e6f5a4b3c2d
          type: string
        name:
          type: string
        type:
          enum:
            - WEBHOOK
            - CONNECTOR
          type: string
      required:
        - id
        - type
        - name
        - config
        - enabled
      type: object
    DestinationPage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Destination"
          type: array
        next_cursor:
          type:
            - string
            - "null"
      required:
        - items
        - next_cursor
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ExportConsentAudienceBody:
      additionalProperties: false
      properties:
        cursor:
          description: Opaque cursor from a previous response.
          type: string
        fields:
          description: "Contact identifiers to include: email and/or phone. Defaults to [email]."
          items:
            enum:
              - email
              - phone
            type: string
          type:
            - array
            - "null"
          uniqueItems: true
        limit:
          description: Page size (default 100).
          format: int64
          maximum: 1000
          minimum: 1
          type: integer
        purpose:
          description: Consent purpose whose granted subjects form the audience.
          minLength: 1
          type: string
        reason:
          description: Why the audience is being exported. Required and recorded in the audit log.
          maxLength: 500
          minLength: 1
          type: string
      required:
        - purpose
        - reason
      type: object
    LegalHold:
      additionalProperties: false
      properties:
        basis:
          description: Legal basis for the hold.
          type: string
        created_at:
          format: date-time
          type: string
        domain:
          description: Data domain held, or null for the whole subject.
          type:
            - string
            - "null"
        id:
          examples:
            - hold_1f0c0b6a7d5e4a2b9c8d7e6f5a4b3c2d
          type: string
        reason:
          type: string
        released_at:
          format: date-time
          type:
            - string
            - "null"
        user_id:
          format: uuid
          type: string
      required:
        - id
        - user_id
        - domain
        - reason
        - basis
        - created_at
        - released_at
      type: object
    LegalHoldPage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/LegalHold"
          type: array
        next_cursor:
          type:
            - string
            - "null"
      required:
        - items
        - next_cursor
      type: object
    Permission:
      additionalProperties: false
      properties:
        builtin:
          type: boolean
        created_at:
          format: date-time
          type: string
        name:
          examples:
            - myapp.orders.refund
          type: string
      required:
        - name
        - builtin
        - created_at
      type: object
    PermissionHolder:
      additionalProperties: false
      properties:
        actor_id:
          type: string
        granted_at:
          format: date-time
          type: string
        granted_by:
          type:
            - string
            - "null"
        role_id:
          type: string
        role_name:
          type: string
      required:
        - actor_id
        - role_id
        - role_name
        - granted_by
        - granted_at
      type: object
    PermissionHolderPage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/PermissionHolder"
          type: array
        next_cursor:
          description: "Always null: recertification returns the full set."
          type:
            - string
            - "null"
      required:
        - items
        - next_cursor
      type: object
    PermissionPage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Permission"
          type: array
        next_cursor:
          type:
            - string
            - "null"
      required:
        - items
        - next_cursor
      type: object
    PrivacyRequest:
      additionalProperties: false
      properties:
        completed_at:
          description: When processing finished, or null.
          format: date-time
          type:
            - string
            - "null"
        id:
          description: Request identifier.
          examples:
            - pr_1f0c0b6a7d5e4a2b9c8d7e6f5a4b3c2d
          type: string
        policy_id:
          description: Compliance policy snapshot applied to this request.
          type: string
        requested_at:
          description: When the request was accepted.
          format: date-time
          type: string
        scheduled_at:
          description: When the erasure pipeline is due to run (grace deadline).
          format: date-time
          type: string
        status:
          description: Lifecycle status.
          enum:
            - REQUESTED
            - PROCESSING
            - DONE
            - MANUAL_REVIEW
            - CANCELED
          type: string
        type:
          description: Request type.
          enum:
            - DELETION
            - EXPORT
            - CONSENT_WITHDRAWAL
          type: string
        user_id:
          description: Canonical user id of the data subject.
          format: uuid
          type: string
      required:
        - id
        - user_id
        - type
        - status
        - policy_id
        - scheduled_at
        - requested_at
        - completed_at
      type: object
    PrivacyRequestPage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/PrivacyRequest"
          type: array
        next_cursor:
          description: Opaque cursor for the next page, or null.
          type:
            - string
            - "null"
      required:
        - items
        - next_cursor
      type: object
    Problem:
      additionalProperties: false
      properties:
        code:
          description: Machine-readable error code.
          enum:
            - validation_failed
            - unauthenticated
            - permission_denied
            - not_found
            - conflict
            - idempotency_conflict
            - legal_hold_active
            - policy_violation
            - rate_limited
            - internal
          type: string
        detail:
          description: Human-readable explanation specific to this occurrence.
          type: string
        errors:
          description: Optional list of individual error details.
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type: array
        instance:
          description: URI reference identifying this specific occurrence.
          format: uri
          type: string
        status:
          description: HTTP status code.
          format: int64
          type: integer
        title:
          description: Short, human-readable summary of the problem type.
          type: string
        type:
          description: URI reference to documentation for this error type.
          format: uri
          type: string
      required:
        - code
      type: object
    Profile:
      additionalProperties: false
      properties:
        fields:
          additionalProperties:
            $ref: "#/components/schemas/ProfileField"
          description: PII fields keyed by field name.
          type: object
        updated_at:
          description: When the profile was last written, or null.
          format: date-time
          type:
            - string
            - "null"
        user_id:
          description: Canonical user id of the data subject.
          format: uuid
          type: string
        view:
          description: MASKED = hint-based projection, FULL = original values.
          enum:
            - MASKED
            - FULL
          type: string
      required:
        - user_id
        - fields
        - view
        - updated_at
      type: object
    ProfileField:
      additionalProperties: false
      properties:
        hint:
          description: Masking hint that decides how the value is projected when masked.
          enum:
            - EMAIL
            - NAME
            - PHONE
            - ADDRESS
            - GENERIC
          type: string
        value:
          description: "Field value: masked projection or original, depending on the profile view."
          type: string
      required:
        - value
        - hint
      type: object
    ProfileFieldWrite:
      additionalProperties: false
      properties:
        hint:
          description: Masking hint. Required unless the instance defines this field, in which case it may be omitted and must otherwise match the definition.
          enum:
            - EMAIL
            - NAME
            - PHONE
            - ADDRESS
            - GENERIC
          type: string
        value:
          description: Field value (the original, never a masked projection).
          type: string
      required:
        - value
      type: object
    RevealUserProfileBody:
      additionalProperties: false
      properties:
        reason:
          description: Why the original values are being viewed. Required and recorded in the audit log.
          maxLength: 500
          minLength: 1
          type: string
      required:
        - reason
      type: object
    Role:
      additionalProperties: false
      properties:
        builtin:
          description: Builtin roles are seeded by Dilion and cannot be redefined.
          type: boolean
        created_at:
          format: date-time
          type: string
        id:
          examples:
            - role_1f0c0b6a7d5e4a2b9c8d7e6f5a4b3c2d
          type: string
        name:
          type: string
        permissions:
          items:
            type: string
          type: array
      required:
        - id
        - name
        - permissions
        - builtin
        - created_at
      type: object
    RoleAssignment:
      additionalProperties: false
      properties:
        actor_id:
          type: string
        granted_at:
          format: date-time
          type: string
        granted_by:
          type:
            - string
            - "null"
        id:
          format: int64
          type: integer
        revoked_at:
          format: date-time
          type:
            - string
            - "null"
        revoked_by:
          type:
            - string
            - "null"
        role_id:
          type: string
      required:
        - id
        - actor_id
        - role_id
        - granted_by
        - granted_at
        - revoked_by
        - revoked_at
      type: object
    RoleAssignmentPage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/RoleAssignment"
          type: array
        next_cursor:
          type:
            - string
            - "null"
      required:
        - items
        - next_cursor
      type: object
    RolePage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/Role"
          type: array
        next_cursor:
          type:
            - string
            - "null"
      required:
        - items
        - next_cursor
      type: object
    SubjectConsent:
      additionalProperties: false
      properties:
        granted:
          description: Whether consent is currently granted.
          type: boolean
        policy_version:
          description: Policy version the consent was recorded against.
          type: string
        purpose:
          description: Consent purpose key.
          type: string
        reconfirm_due:
          description: When re-confirmation notice is due, or null.
          format: date-time
          type:
            - string
            - "null"
        updated_at:
          format: date-time
          type: string
        user_id:
          description: Canonical user id of the data subject.
          format: uuid
          type: string
      required:
        - user_id
        - purpose
        - granted
        - policy_version
        - updated_at
        - reconfirm_due
      type: object
    SubjectConsentPage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/SubjectConsent"
          type: array
        next_cursor:
          description: Opaque cursor for the next page, or null. Pages may be shorter than limit while a reconfirm filter scans.
          type:
            - string
            - "null"
      required:
        - items
        - next_cursor
      type: object
    UpdateConsentBody:
      additionalProperties: false
      properties:
        granted:
          description: true = grant, false = withdraw.
          type: boolean
        policy_version:
          description: Policy version presented to the subject.
          minLength: 1
          type: string
        purpose:
          description: Consent purpose key.
          minLength: 1
          type: string
        source:
          default: API
          description: Where the change originated.
          enum:
            - UI
            - API
            - IMPORT
          type: string
      required:
        - purpose
        - granted
        - policy_version
        - source
      type: object
    UpdateDestinationBody:
      additionalProperties: false
      properties:
        config:
          additionalProperties: {}
          type: object
        enabled:
          type: boolean
      type: object
    UpdateMeConsentBody:
      additionalProperties: false
      properties:
        granted:
          description: true = grant, false = withdraw.
          type: boolean
        policy_version:
          description: Policy version presented to the subject.
          minLength: 1
          type: string
        purpose:
          description: Consent purpose key.
          minLength: 1
          type: string
      required:
        - purpose
        - granted
        - policy_version
      type: object
    UpdateUserProfileBody:
      additionalProperties: false
      properties:
        remove:
          description: Field names to delete.
          items:
            type: string
          type:
            - array
            - "null"
        set:
          additionalProperties:
            $ref: "#/components/schemas/ProfileFieldWrite"
          description: Fields to upsert, keyed by field name.
          type: object
      type: object
    UserMatch:
      additionalProperties: false
      properties:
        field_key:
          description: The vault field that matched, or null for auth identifiers.
          type:
            - string
            - "null"
        source:
          description: Which identifier matched.
          enum:
            - AUTH_EMAIL
            - AUTH_PHONE
            - PROFILE_FIELD
          type: string
        user_id:
          description: Canonical user id of the matched subject.
          format: uuid
          type: string
      required:
        - user_id
        - source
        - field_key
      type: object
    UserMatchPage:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/UserMatch"
          type: array
        next_cursor:
          description: Opaque cursor for the next page, or null.
          type:
            - string
            - "null"
      required:
        - items
        - next_cursor
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT or dk_ API key
      description: "Management plane credential: a `service_role` JWT, a scoped API key (`dk_...`), or a user access token (`role=authenticated`) whose RBAC role assignments grant the permission the operation requires (deny-by-default)."
      scheme: bearer
      type: http
info:
  title: Dilion Platform API
  version: 0.1.0
openapi: 3.1.0
paths:
  /iam/v1/api-keys:
    get:
      description: Requires permission `audit.read`.
      operationId: listApiKeys
      parameters:
        - explode: false
          in: query
          name: limit
          schema:
            default: 20
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: cursor
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyPage"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
