  /iam/v1/audit/events:
    get:
      description: |-
        Requires permission `audit.read`.

        Events are returned newest first. `subject_id` answers the reverse question "who accessed subject X" (§5.3); the subject manifest itself is only returned by `getAuditEvent`.

        Reading the audit log is **not itself audited**: recording an access event for every audit read would recurse without adding evidence. The audit log is append-only — no write permission for it exists (§5.4).
      operationId: listAuditEvents
      parameters:
        - description: Page size.
          explode: false
          in: query
          name: limit
          schema:
            default: 20
            description: Page size.
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - description: Opaque cursor from a previous response.
          explode: false
          in: query
          name: cursor
          schema:
            description: Opaque cursor from a previous response.
            type: string
        - description: Filter by the actor that performed the action.
          explode: false
          in: query
          name: actor_id
          schema:
            description: Filter by the actor that performed the action.
            type: string
        - description: Filter by action, e.g. PII_FULL_READ.
          explode: false
          in: query
          name: action
          schema:
            description: Filter by action, e.g. PII_FULL_READ.
            type: string
        - description: "Reverse lookup: only events whose subject manifest contains this data subject (§5.3)."
          explode: false
          in: query
          name: subject_id
          schema:
            description: "Reverse lookup: only events whose subject manifest contains this data subject (§5.3)."
            type: string
        - description: Only events at or after this time (RFC 3339). 정기 점검 리포트용 기간 창.
          explode: false
          in: query
          name: from
          schema:
            description: Only events at or after this time (RFC 3339). 정기 점검 리포트용 기간 창.
            format: date-time
            type: string
        - description: Only events before this time (RFC 3339, exclusive).
          explode: false
          in: query
          name: to
          schema:
            description: Only events before this time (RFC 3339, exclusive).
            format: date-time
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Not Found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Conflict
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal Server Error
      security:
        - bearerAuth: []
      summary: List audit events
      tags:
        - iam
