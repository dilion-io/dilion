openapi: 3.1.0
info:
  title: Dilion Auth API (Supabase compatible)
  version: 0.2.0
  description: |
    **Curated, hand-maintained spec — not generated.**

    This document describes the Supabase Auth (gotrue) compatible surface that `internal/auth`
    actually serves in this build, mounted at `/auth/v1`. It is written by hand from the Go
    handlers (`internal/auth/*.go`) rather than generated by `cmd/openapi`, and it is *not*
    upstream's gotrue spec: **only what the Go code serves is documented here**, and every field
    below exists in a Go struct tag. When `internal/auth` changes, update this file by hand.

    ### Credentials

    | Credential | Where |
    | --- | --- |
    | none | `/health`, `/settings`, `/signup`, `/token`, `/verify`, `/otp`, `/magiclink`, `/recover`, `/resend`, `/authorize`, `/callback`, `/sso`, `/sso/saml/*`, `/passkeys/authentication/*`, `/oauth/authorize`, `/oauth/clients/register`, `/.well-known/*` |
    | user access token | `/user`, `/logout`, `/reauthenticate`, `/user/identities/*`, `/factors/*`, `/passkeys` (management), `/oauth/userinfo`, `/oauth/authorizations/*`, `/user/oauth/grants` |
    | OAuth **client** credentials | `/oauth/token` (HTTP Basic, form/JSON `client_id`+`client_secret`, or none for a public client) |
    | `service_role` JWT **or** a user access token whose actor holds the `users.admin` RBAC permission | every `/admin/*` route, plus `/invite` |

    ### Two error families

    Almost every endpoint answers gotrue's envelope
    (`{"code": <http status>, "error_code": "...", "msg": "..."}` — see `ErrorResponse`).

    Two places answer the **RFC 6749** shape (`{"error": "...", "error_description": "..."}` — see
    `OAuthErrorResponse`) instead, because that is what upstream does and what OAuth clients parse:

    - `POST /auth/v1/oauth/token` — every failure, always with HTTP **400**, whatever the OAuth
      error code says.
    - `POST /auth/v1/token?grant_type=id_token` — parameter/verification failures, also HTTP 400.

    ### Redirects

    `GET /verify`, `GET /authorize`, `GET|POST /callback`, `POST /sso`, `POST /sso/saml/acs` and
    `GET|POST /oauth/authorize` answer with an HTTP redirect rather than a body. Which half of the
    URL carries the result matters:

    - **Implicit flow** (no `code_challenge`): the session lands in the **fragment** —
      `#access_token=…&token_type=bearer&expires_in=…&expires_at=…&refresh_token=…&sb=` — because a
      fragment is never sent to a server and therefore never lands in an access log.
    - **PKCE flow** (`code_challenge` supplied): the redirect carries `?code=<auth_code>` in the
      **query string**, to be exchanged at `POST /token?grant_type=pkce`.
    - **Errors** always go into the fragment (`#error=…&error_code=…&error_description=…&sb=`) and,
      for PKCE flows and the external-provider callback, into the query string as well.

    ### Feature flags

    Whole route groups are compiled in but gated at request time; with the flag off they answer
    **404** with a specific `error_code`, so a deployment without the feature is indistinguishable
    from one that predates it. Config is read from `DILION_AUTH_<NAME>` first, falling back to
    upstream's `GOTRUE_<NAME>` spelling.

    | Flag | Gates | 404 `error_code` |
    | --- | --- | --- |
    | `DILION_AUTH_PASSKEY_ENABLED` | `/passkeys/**` | `passkey_disabled` |
    | `DILION_AUTH_OAUTH_SERVER_ENABLED` | `/oauth/**`, `/user/oauth/grants`, `/admin/oauth/**`, `/.well-known/oauth-authorization-server` | `feature_disabled` |
    | `DILION_AUTH_SAML_ENABLED` | `/sso/**` | `saml_provider_disabled` |
    | `DILION_AUTH_EXTERNAL_PHONE_ENABLED` | every phone/SMS path (see the **Phone** tag) | *not* 404 — `phone_provider_disabled`, 400/422 |
    | `DILION_AUTH_EXTERNAL_<PROVIDER>_ENABLED` | that provider at `/authorize` and `/callback` | *not* 404 — `validation_failed` / `provider_disabled` |
    | `DILION_AUTH_EXTERNAL_ANONYMOUS_USERS_ENABLED` | `POST /signup` with neither email nor phone | *not* 404 — `anonymous_provider_disabled`, 422 |
    | `DILION_AUTH_MFA_TOTP_ENROLL_ENABLED` / `..._VERIFY_ENABLED` | TOTP enroll / verify+challenge | *not* 404 — `mfa_totp_*_not_enabled`, 422 |
    | `DILION_AUTH_SECURITY_MANUAL_LINKING_ENABLED` | `GET /user/identities/authorize` | *not* 404 — `manual_linking_disabled`, 422 |
    | `DILION_AUTH_SECURITY_CAPTCHA_ENABLED` | adds `gotrue_meta_security.captcha_token` to the unauthenticated credential surfaces | — |

    `/admin/*` is **not** feature-flagged; the `/admin/oauth/**` group inherits the OAuth-server
    flag and answers `404 feature_disabled` before the admin gate runs.

    ### Rate limits

    Two independent mechanisms, both of which apply:

    - **Per-IP token buckets** (`DILION_AUTH_RATE_LIMIT_*`, every budget "requests per 5 minutes"
      except anonymous sign-ins, which are per hour; burst 30). Exceeding one answers
      `429 over_request_rate_limit`. Each operation below names the bucket it draws on.
    - **Per-user send throttles** — `MAILER_MAX_FREQUENCY` for one-time-token mail
      (`429 over_email_send_rate_limit`, message carries the seconds remaining) and
      `SMS_MAX_FREQUENCY` for OTP SMS (`429 over_sms_send_rate_limit`).

    ### Notable deviations from upstream

    - `DELETE /admin/users/{user_id}` answers `200 {}` (upstream's *implementation* behaviour,
      which supabase-js is written against), not a user object.
    - `POST /token?grant_type=password` draws on the OTP bucket, not the (much larger) refresh
      bucket — a password grant is a credential-guessing surface.
    - Both passkey login endpoints are rate limited; upstream limits only `.../options`.
    - `POST /oauth/authorize` is mounted alongside `GET` (RFC 6749 §3.1 permits it); upstream
      mounts `GET` only.
    - A phone signup requires a password (upstream accepts an empty one).
    - `GET /admin/audit` is Dilion's own projection of `dilion_audit.events` into upstream's audit
      body — the rows are Dilion access records, not gotrue's `auth.audit_log_entries`.
    - MFA factors: only **TOTP** exists. Phone and WebAuthn factors answer
      `422 mfa_phone_*_not_enabled` / `422 mfa_webauthn_*_not_enabled`.
    - External providers: only **apple, github, google, kakao** have a driver, although
      `GET /settings` reports the enabled flag of all 25 provider slots.

servers:
  - url: http://localhost:8787
    description: Local development

tags:
  - name: Core
    description: |
      Health, settings, sign-up, the `/token` grants, the signed-in user and sign-out — the
      endpoints every client touches.
  - name: Email flows
    description: |
      One-time-token flows delivered by mail: confirmation, magic link, email OTP, recovery,
      email change, invite, reauthentication, and the `/verify` redemption they all end at.
      Each send is throttled per user by `MAILER_MAX_FREQUENCY` on top of the per-IP bucket.
  - name: Phone
    description: |
      The SMS half of the same flows. There are no phone-only paths: `/signup`, `/otp`, `/verify`,
      `/resend`, `PUT /user` and `GET /reauthenticate` switch to the phone branch when a `phone`
      is supplied. Every one of them needs `DILION_AUTH_EXTERNAL_PHONE_ENABLED=true`, otherwise
      `phone_provider_disabled`. Delivery is Twilio (`SMS_PROVIDER=twilio`) or an injected sender;
      sends are throttled per user by `SMS_MAX_FREQUENCY` and per IP by `RATE_LIMIT_SMS_SENT`.
  - name: PKCE
    description: |
      RFC 7636 for the mail/SMS flows, the external-provider flow and SSO. Send
      `code_challenge` + `code_challenge_method` (`s256` or `plain`, 43–128 unreserved characters)
      when starting a flow; the redirect then carries `?code=…` instead of a fragment, and
      `POST /token?grant_type=pkce` exchanges it for a session. The pair is all-or-nothing.
  - name: External OAuth
    description: |
      Sign in with a third-party provider — the redirect flow (`/authorize` → provider →
      `/callback`), identity linking/unlinking, and `POST /token?grant_type=id_token` for clients
      that already hold an ID token (Sign in with Apple on iOS, Google One Tap, the Kakao SDK).
      Drivers exist for **apple, github, google, kakao**; each needs
      `DILION_AUTH_EXTERNAL_<PROVIDER>_ENABLED=true` plus its client id/secret.
  - name: MFA
    description: |
      Multi-factor authentication. Only **TOTP** factors exist. Verifying a factor against a
      session raises it to `aal2`, rotates its refresh token and kills every other session below
      `aal2`. Enrolling a second factor, and unenrolling a verified one, require `aal2` already.
  - name: Passkeys
    description: |
      WebAuthn discoverable credentials. Requires `DILION_AUTH_PASSKEY_ENABLED=true` plus
      `WEBAUTHN_RP_ID` / `WEBAUTHN_RP_ORIGINS`; every route answers `404 passkey_disabled`
      otherwise. Max 10 passkeys per user, challenges expire after 5 minutes.
  - name: SSO/SAML
    description: |
      SAML 2.0 single sign-on, and the admin surface that registers identity providers.
      Requires `DILION_AUTH_SAML_ENABLED=true` plus `SAML_PRIVATE_KEY`; the `/sso/**` routes answer
      `404 saml_provider_disabled` otherwise. `/admin/sso/**` is **not** flag-gated.
  - name: OAuth2 Server
    description: |
      Dilion acting as an OAuth 2.1 / OIDC **authorization server** for third-party clients:
      dynamic and admin client registration, the authorization endpoint, the token endpoint
      (RFC 6749 error bodies), userinfo, the consent API the hosted consent page calls, and the
      user's own grant management. Requires `DILION_AUTH_OAUTH_SERVER_ENABLED=true`; every route
      answers `404 feature_disabled` otherwise.
  - name: Admin
    description: |
      Privileged administration. Requires a `service_role` JWT **or** a user access token whose
      actor holds the `users.admin` RBAC permission; anything else is `403 not_admin`. Reads and
      writes on `/admin/users*` are recorded in Dilion's access log.
  - name: Well-known
    description: |
      Unauthenticated discovery documents, served with `Cache-Control: public, max-age=600`.

security:
  - bearerAuth: []

paths:
  /auth/v1/health:
    get:
      tags: [Core]
      operationId: authHealth
      summary: Health check
      description: |
        gotrue's healthcheck body. `name` stays `"GoTrue"` on purpose: supabase-js and the
        Supabase CLI probe this endpoint and match on it. No authentication, no rate limit.
      security: []
      responses:
        '200':
          description: Server is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'

  /auth/v1/settings:
    get:
      tags: [Core]
      operationId: authSettings
      summary: Public deployment settings
      description: |
        What this deployment allows, read straight off the configuration. Unauthenticated on
        purpose: supabase-js reads it before any credential exists, to decide which sign-in options
        to render.

        `external` reports the `DILION_AUTH_EXTERNAL_<PROVIDER>_ENABLED` flag of all 25 provider
        slots — including `email` and `phone`, which are providers here — plus `anonymous_users`.
        A slot may report `true` without a driver existing for it (only apple, github, google and
        kakao have one); such a provider fails at `/authorize` with `validation_failed`.
      security: []
      responses:
        '200':
          description: The deployment's public settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'

  /auth/v1/.well-known/jwks.json:
    get:
      tags: [Well-known]
      operationId: authJwks
      summary: JSON Web Key Set
      description: |
        The **public** half of every ES256 key in `JWT_KEYS`. A symmetric-only deployment (HS256
        with `JWT_SECRET` — the zero-config developer path) legitimately publishes an **empty** key
        set: the shared secret must never leave the server, and that is the same answer upstream
        gives. Private key material is structurally impossible to leak here.

        Served with `Cache-Control: public, max-age=600`. No authentication.
      security: []
      responses:
        '200':
          description: The key set.
          headers:
            Cache-Control:
              description: Always `public, max-age=600`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JWKSet'

  /auth/v1/.well-known/openid-configuration:
    get:
      tags: [Well-known]
      operationId: authOpenIDConfiguration
      summary: OIDC Discovery document
      description: |
        OpenID Connect Discovery metadata. The authorization / token / userinfo endpoints are
        advertised **unconditionally**, relative to the issuer, exactly as upstream advertises
        them: the document is the contract, not a capability probe, so a deployment with the OAuth
        server disabled still publishes the paths (they answer `404 feature_disabled`).
        `registration_endpoint` is the one exception — it appears only while dynamic client
        registration can actually be used.

        Two deliberate deviations from upstream: `id_token_signing_alg_values_supported` reports
        what this deployment can actually verify (`["ES256"]` with a key set, `["HS256"]` on the
        symmetric-only path, both during a rotation) instead of a hard-coded list; and the issuer
        falls back to `SITE_URL + /auth/v1` when `JWT_ISSUER` is unset. Note that access tokens
        only carry an `iss` claim when `JWT_ISSUER` is configured.

        Served with `Cache-Control: public, max-age=600`. No authentication.
      security: []
      responses:
        '200':
          description: The discovery document.
          headers:
            Cache-Control:
              description: Always `public, max-age=600`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenIDConfiguration'

  /auth/v1/.well-known/oauth-authorization-server:
    get:
      tags: [Well-known, OAuth2 Server]
      operationId: authOAuthAuthorizationServerMetadata
      summary: RFC 8414 authorization-server metadata
      description: |
        RFC 8414 OAuth 2.0 Authorization Server Metadata. OIDC Discovery is an extension of
        RFC 8414, so **one** document satisfies both specs and the same handler serves both paths —
        but this one exists only while the OAuth server is enabled.

        Feature-flagged: `404 feature_disabled` unless `DILION_AUTH_OAUTH_SERVER_ENABLED=true`.
        No authentication.
      security: []
      responses:
        '200':
          description: The metadata document (identical to the OIDC discovery body).
          headers:
            Cache-Control:
              description: Always `public, max-age=600`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenIDConfiguration'
        '404':
          $ref: '#/components/responses/OAuthServerDisabled'

  /auth/v1/signup:
    post:
      tags: [Core, Phone, PKCE]
      operationId: authSignup
      summary: Sign up with email, phone, or anonymously
      description: |
        Three flows behind one endpoint, chosen by the body:

        - **email + password** — creates the user and its `email` identity.
        - **phone + password** — creates the user and its `phone` identity. Requires
          `DILION_AUTH_EXTERNAL_PHONE_ENABLED=true`, otherwise `400 phone_provider_disabled`.
          Unlike upstream, a password is **required**; passwordless phone sign-in is `POST /otp`.
        - **neither** — an anonymous sign-in (`is_anonymous: true`, no identity, no password).
          Requires `DILION_AUTH_EXTERNAL_ANONYMOUS_USERS_ENABLED=true`, otherwise
          `422 anonymous_provider_disabled`. The account is later upgraded by adding an
          email/phone through `PUT /user`.

        Supplying **both** `email` and `phone` is `400 validation_failed`.

        **The 200 body has two shapes** (`oneOf`), chosen exactly as upstream chooses it:

        | Condition | Body |
        | --- | --- |
        | `MAILER_AUTOCONFIRM=true` (email) / `SMS_AUTOCONFIRM=true` (phone) / anonymous | `AccessTokenResponse` — a full session |
        | confirmation required | the bare `User`, **no session**; a confirmation mail/OTP goes out and the account becomes usable through `/verify` |

        A repeat signup never reveals whether the address is taken: with autoconfirm on it is
        `422 user_already_exists` (the identifier is provably in use either way); with confirmation
        pending, a **fabricated** user object is returned — fresh random id, submitted metadata, no
        identities.

        Adding `code_challenge` + `code_challenge_method` turns a confirmation-required *email*
        signup into a PKCE flow. PKCE on a phone signup is rejected (`400 validation_failed`):
        a phone signup returns its session in the body, so there is nothing for a code exchange to
        hand over.

        Rate limits: `RATE_LIMIT_OTP` per IP (email/phone), `RATE_LIMIT_ANONYMOUS_USERS` per IP per
        hour (anonymous). CAPTCHA runs first when enabled. No authentication.
      security: []
      parameters:
        - $ref: '#/components/parameters/XJwtAud'
        - $ref: '#/components/parameters/RedirectToQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupParams'
            examples:
              email:
                summary: Email + password
                value:
                  email: user@example.com
                  password: secret123
                  data: { display_name: Ada }
              phone:
                summary: Phone + password
                value:
                  phone: '+821012345678'
                  password: secret123
                  channel: sms
              anonymous:
                summary: Anonymous sign-in
                value: {}
      responses:
        '200':
          description: |
            A session (autoconfirm / anonymous) **or** the bare user (confirmation required).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AccessTokenResponse'
                  - $ref: '#/components/schemas/User'
        '400':
          description: |
            `validation_failed` — invalid email, missing password, both identifiers supplied,
            invalid phone, bad channel, malformed PKCE parameters, or a password longer than 72
            bytes; `phone_provider_disabled`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            `user_already_exists`; `weak_password` (with a `weak_password.reasons` array);
            `signup_disabled` — `DISABLE_SIGNUP=true` or a `BeforeSignup` hook rejected it;
            `anonymous_provider_disabled`; `captcha_failed`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/v1/token:
    post:
      tags: [Core, PKCE, External OAuth, Phone]
      operationId: authToken
      summary: Grant a session (password, refresh_token, pkce, id_token)
      description: |
        One endpoint, four grants selected by the `grant_type` **query** parameter (a form or JSON
        body field is accepted as a fallback). An unregistered grant answers
        `400 invalid_credentials` with the message `"unsupported_grant_type"`.

        **`password`** — `email` (or `phone`) + `password`. A wrong password and an unknown
        identifier return the identical `400 invalid_credentials` / `"Invalid login credentials"`
        body, so the endpoint is not an enumeration oracle. An unconfirmed identifier is
        `400 email_not_confirmed` / `400 phone_not_confirmed`. CAPTCHA applies.
        Bucket: `RATE_LIMIT_OTP`.

        **`refresh_token`** — rotation with reuse detection:

        - unknown token → `400 refresh_token_not_found`
        - **already-revoked token** → within `SECURITY_REFRESH_TOKEN_REUSE_INTERVAL` the child
          token is replayed; outside it the whole token family is revoked, the session destroyed,
          and `400 refresh_token_already_used` returned — the revocation is committed even though
          the request fails
        - missing/expired session → `400 session_not_found` / `400 session_expired`
        - success → the presented token is revoked and a child token (same `session_id`,
          `parent` = the old token) is issued alongside a fresh access token

        Bucket: `RATE_LIMIT_TOKEN_REFRESH`.

        **`pkce`** — exchanges `auth_code` + `code_verifier` for a session. The code is single-use
        (consumed inside the issuing transaction, with the flow-state row locked), expires after
        `EXTERNAL_FLOW_STATE_EXPIRY_DURATION`, and — when the flow came from an external provider —
        the response carries `provider_token` / `provider_refresh_token`.
        Bucket: `RATE_LIMIT_TOKEN_REFRESH`.

        **`id_token`** — signs in with an ID token the client already holds. The token is verified
        against the issuer's published keys, its audience must be one of the provider's configured
        client ids, and the `nonce` must match unless `EXTERNAL_<PROVIDER>_SKIP_NONCE_CHECK` is
        set. `link_identity: true` turns the grant into a manual link onto the caller's account and
        then requires an `Authorization` header. **Failures here use the RFC 6749 error body, with
        HTTP 400**, not the gotrue envelope. Bucket: `RATE_LIMIT_TOKEN_REFRESH`.

        No authentication (except `id_token` + `link_identity`).
      security: []
      parameters:
        - name: grant_type
          in: query
          required: true
          description: Which grant to run.
          schema:
            type: string
            enum: [password, refresh_token, pkce, id_token]
        - $ref: '#/components/parameters/XJwtAud'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/PasswordGrantParams'
                - $ref: '#/components/schemas/RefreshTokenGrantParams'
                - $ref: '#/components/schemas/PKCEGrantParams'
                - $ref: '#/components/schemas/IDTokenGrantParams'
            examples:
              password:
                summary: grant_type=password
                value:
                  email: user@example.com
                  password: secret123
              refresh_token:
                summary: grant_type=refresh_token
                value:
                  refresh_token: k3n8x1q7pz0d
              pkce:
                summary: grant_type=pkce
                value:
                  auth_code: 0f1c2e3d-4b5a-6978-8765-4321fedcba98
                  code_verifier: dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk
              id_token:
                summary: grant_type=id_token
                value:
                  provider: google
                  id_token: eyJhbGciOi...
                  nonce: n-0S6_WzA2Mj
      responses:
        '200':
          description: A new session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '400':
          description: |
            gotrue envelope: `invalid_credentials` (bad login or unsupported grant),
            `validation_failed`, `refresh_token_not_found`, `refresh_token_already_used`,
            `session_not_found`, `session_expired`, `email_not_confirmed`, `phone_not_confirmed`,
            `bad_code_verifier`, `user_not_found`, `captcha_failed`.

            RFC 6749 envelope (`grant_type=id_token` only): `{"error":"invalid request", …}`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/OAuthErrorResponse'
        '403':
          description: '`user_banned` — `banned_until` is in the future.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`flow_state_not_found` — the auth code is unknown, redeemed, or has no user.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            `flow_state_expired`; `phone_provider_disabled`; `identity_already_exists` (id_token
            with `link_identity`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/v1/user:
    get:
      tags: [Core]
      operationId: authGetUser
      summary: Get the signed-in user
      description: |
        Returns the user named by the `sub` claim of the Bearer access token, with its identities
        and its MFA `factors` loaded. Requires a **user access token**. Not rate limited.
      responses:
        '200':
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/NoAuthorization'
        '403':
          $ref: '#/components/responses/BadJwt'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Core, Phone, PKCE]
      operationId: authUpdateUser
      summary: Update the signed-in user
      description: |
        Self-service update of `email`, `phone`, `password` and/or `data` (`user_metadata`). An
        empty body — or one that changes nothing — answers `200` with the unchanged user.

        - **email**: with `MAILER_AUTOCONFIRM=true` the address applies immediately, the email
          identity's `identity_data` is kept in sync, and the **old** address is notified.
          Otherwise the new address is parked in `new_email` and a confirmation mail goes out —
          two mails when `MAILER_SECURE_EMAIL_CHANGE_ENABLED` is on, and both links must be
          followed. A duplicate answers `422 email_exists`.
        - **phone**: with `SMS_AUTOCONFIRM=true` the number is applied at once; otherwise it is
          parked in `new_phone` and an OTP is texted, redeemed with
          `POST /verify {type: "phone_change"}`. A duplicate answers `422 phone_exists`.
        - **password**: **revokes every _other_ session** and its refresh tokens — the calling
          session survives. Reusing the current password answers `422 same_password`. With
          `SECURITY_UPDATE_PASSWORD_REQUIRE_REAUTHENTICATION=true` a `nonce` from
          `GET /reauthenticate` is required unless the calling session is younger than 24 hours;
          missing → `400 reauthentication_needed`, wrong/expired →
          `401 reauthentication_not_valid`.
        - **data**: a **merge**, not a replace — a `null` value deletes that key.
        - `app_metadata` is parsed but ignored here: a user may not escalate their own claims.

        `code_challenge` + `code_challenge_method` make a confirmation-required email change a PKCE
        flow. Requires a **user access token**. Bucket: `RATE_LIMIT_OTP`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateParams'
      responses:
        '200':
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: |
            `validation_failed` — invalid email/phone/channel or malformed PKCE parameters;
            `phone_provider_disabled`; `reauthentication_needed`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: |
            `no_authorization`; `reauthentication_not_valid` — the nonce is wrong or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/BadJwt'
        '422':
          description: |
            `email_exists`, `phone_exists`, `same_password`, `weak_password`, `validation_failed`,
            `user_sso_managed`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: |
            `over_request_rate_limit` (per IP) or `over_email_send_rate_limit` /
            `over_sms_send_rate_limit` (per user, when a confirmation is sent).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/v1/logout:
    post:
      tags: [Core]
      operationId: authLogout
      summary: Sign out
      description: |
        Always answers `204` with an empty body. The request body is ignored.
        Requires a **user access token**. Not rate limited.
      parameters:
        - name: scope
          in: query
          required: false
          description: |
            - `global` (default, also used when the token carries no `session_id`) — every session
              of the user is deleted and every refresh token revoked.
            - `local` — only the calling session.
            - `others` — every session except the calling one; the caller stays signed in.
          schema:
            type: string
            enum: [global, local, others]
            default: global
      responses:
        '204':
          description: Signed out.
        '400':
          description: '`validation_failed` — unsupported `scope`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/NoAuthorization'
        '403':
          $ref: '#/components/responses/BadJwt'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/v1/verify:
    get:
      tags: [Email flows, Phone, PKCE]
      operationId: authVerifyGet
      summary: Follow a confirmation link (redirects)
      description: |
        The target of every link Dilion mails. It redeems the token and **redirects (303)** — it
        never returns a body on success.

        - **implicit flow** → `303` to `redirect_to` with the session in the **fragment**:
          `#access_token=…&token_type=bearer&expires_in=…&expires_at=…&refresh_token=…&type=<type>&sb=`
        - **PKCE flow** (the mailed token is prefixed `pkce_`) → `303` to
          `redirect_to?code=<auth_code>`, to be exchanged at `POST /token?grant_type=pkce`
        - **first half of a secure email change** → `303` with
          `#message=Confirmation+link+accepted.+Please+proceed+to+confirm+link+sent+to+the+other+email&sb=`
        - **failure** → `303` with `#error=<oauth error>&error_code=<gotrue code>&error_description=…&sb=`,
          and the same keys in the query string for a PKCE flow. Nothing about the failure reaches
          the client as an HTTP status.

        `redirect_to` is validated against the redirect allow-list (`URI_ALLOW_LIST`) and falls
        back to `SITE_URL`. On `GET`, `token` is treated as the token **hash** (upstream still
        accepts the older name). Bucket: `RATE_LIMIT_VERIFY`. No authentication, no CAPTCHA
        (a link-follow cannot solve one).
      security: []
      parameters:
        - name: token
          in: query
          required: true
          description: The hashed one-time token from the link. `pkce_`-prefixed for a PKCE flow.
          schema:
            type: string
        - name: type
          in: query
          required: true
          description: Which flow this token belongs to.
          schema:
            type: string
            enum: [signup, invite, magiclink, recovery, email_change, sms, phone_change]
        - $ref: '#/components/parameters/RedirectToQuery'
      responses:
        '303':
          description: |
            Redirect to `redirect_to`. Success and failure both use `303`; read the fragment
            (and, for PKCE, the query string) to tell them apart.
          headers:
            Location:
              description: The redirect target, carrying the session, the auth code, or the error.
              schema:
                type: string
        '400':
          description: |
            `validation_failed` — missing `token` or `type`. Reached only before a usable
            `redirect_to` was resolved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Email flows, Phone]
      operationId: authVerifyPost
      summary: Redeem a one-time token (JSON)
      description: |
        The programmatic half of `/verify`: same redemption, but the session comes back in the
        body. Two mutually exclusive shapes — exactly one of `token` or `token_hash`:

        - `{type, token_hash}` — the hash straight from the link or from
          `POST /admin/generate_link`. Sending `email`, `phone` or `redirect_to` alongside it is
          `400 validation_failed`.
        - `{type, token, email}` or `{type, token, phone}` — the plain OTP the user typed. The
          hash is derived from the (normalised) identifier plus the code. **This is the only way a
          phone OTP comes back**, since an SMS carries no link.

        A token that is unknown, already consumed, or past `MAILER_OTP_EXP` / `SMS_OTP_EXP` all
        answer the same `403 otp_expired`, so the endpoint is not an oracle for which links exist.

        The first half of a secure email change answers `200` with
        `{"msg": "Confirmation link accepted. …", "code": "200"}` instead of a session.

        CAPTCHA applies. Bucket: `RATE_LIMIT_VERIFY`. No authentication.
      security: []
      parameters:
        - $ref: '#/components/parameters/XJwtAud'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyParams'
            examples:
              tokenHash:
                summary: Hash from a link
                value:
                  type: signup
                  token_hash: 8f14e45fceea167a5a36dedd4bea2543
              smsOtp:
                summary: SMS OTP typed by the user
                value:
                  type: sms
                  phone: '+821012345678'
                  token: '123456'
      responses:
        '200':
          description: |
            A session — or, for the first half of a secure email change, `{msg, code}`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AccessTokenResponse'
                  - $ref: '#/components/schemas/MessageResponse'
        '400':
          description: |
            `validation_failed` — missing/ambiguous token, unsupported `type`, invalid phone.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: '`otp_expired` — unknown, consumed or expired token; `user_banned`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`validation_failed` — invalid email format; `captcha_failed`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/v1/otp:
    post:
      tags: [Email flows, Phone, PKCE]
      operationId: authOtp
      summary: Send a magic link or an SMS OTP
      description: |
        Passwordless sign-in. The body's identifier picks the branch; supplying both is
        `400 validation_failed`.

        - **email** — delegates to the magic-link path (see `POST /magiclink`). `channel` may not
          be combined with an email.
        - **phone** — texts a numeric OTP, redeemed with `POST /verify {type:"sms", phone, token}`.
          Needs `DILION_AUTH_EXTERNAL_PHONE_ENABLED=true`.

        `create_user` defaults to **true**: an unknown identifier is signed up. Set it to `false`
        to restrict sending to existing accounts — an unknown one then answers
        `422 otp_disabled`.

        The body is always an empty object `{}` (plus `message_id` when the SMS provider returned
        one), so the endpoint never reveals whether the identifier exists.

        `code_challenge` + `code_challenge_method` make the emailed link a PKCE flow. CAPTCHA
        applies. Buckets: `RATE_LIMIT_EMAIL_SENT` per IP, plus `RATE_LIMIT_SMS_SENT` and the
        per-user `MAILER_MAX_FREQUENCY` / `SMS_MAX_FREQUENCY` throttles.
        No authentication.
      security: []
      parameters:
        - $ref: '#/components/parameters/XJwtAud'
        - $ref: '#/components/parameters/RedirectToQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpParams'
      responses:
        '200':
          description: 'Sent (or silently skipped). `{}`, or `{"message_id": "..."}` for SMS.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendResponse'
        '400':
          description: |
            `validation_failed` — both identifiers, neither identifier, `channel` with an email,
            invalid email/phone/channel, malformed PKCE parameters; `phone_provider_disabled`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            `otp_disabled` — `create_user: false` for an unknown identifier;
            `email_provider_disabled`; `signup_disabled`; `captcha_failed`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`over_request_rate_limit`, `over_email_send_rate_limit`, `over_sms_send_rate_limit`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/v1/magiclink:
    post:
      tags: [Email flows, PKCE]
      operationId: authMagicLink
      summary: Send a magic link
      description: |
        Emails a sign-in link. An address with no account is signed up first (unless
        `DISABLE_SIGNUP=true`, which answers `422 signup_disabled`); a brand-new or unconfirmed
        address receives the **confirmation** template instead of the magic-link one, so the same
        click both confirms and signs in.

        The body is always `{}` — an unknown address is indistinguishable from a known one.

        Needs `DILION_AUTH_EXTERNAL_EMAIL_ENABLED=true`, otherwise `422 email_provider_disabled`.
        CAPTCHA applies. Bucket: `RATE_LIMIT_EMAIL_SENT` plus the per-user `MAILER_MAX_FREQUENCY`
        throttle. No authentication.
      security: []
      parameters:
        - $ref: '#/components/parameters/XJwtAud'
        - $ref: '#/components/parameters/RedirectToQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MagicLinkParams'
      responses:
        '200':
          description: 'Sent. Always the empty object `{}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyObject'
        '400':
          description: '`validation_failed` — invalid email or malformed PKCE parameters.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            `validation_failed` — missing email; `email_provider_disabled`; `signup_disabled`;
            `captcha_failed`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`over_request_rate_limit` or `over_email_send_rate_limit`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/v1/recover:
    post:
      tags: [Email flows, PKCE]
      operationId: authRecover
      summary: Send a password-recovery link
      description: |
        Emails a recovery link. Following it signs the user in (`type=recovery`), after which the
        client calls `PUT /user` with the new password.

        An unknown address answers `200 {}` — the same body a real send produces, so the endpoint
        cannot enumerate accounts. `code_challenge` + `code_challenge_method` make it a PKCE flow.

        CAPTCHA applies. Bucket: `RATE_LIMIT_EMAIL_SENT` plus the per-user `MAILER_MAX_FREQUENCY`
        throttle. No authentication.
      security: []
      parameters:
        - $ref: '#/components/parameters/XJwtAud'
        - $ref: '#/components/parameters/RedirectToQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoverParams'
      responses:
        '200':
          description: 'Sent, or silently skipped for an unknown address. Always `{}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyObject'
        '400':
          description: |
            `validation_failed` — missing/invalid email or malformed PKCE parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`captcha_failed`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`over_request_rate_limit` or `over_email_send_rate_limit`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/v1/resend:
    post:
      tags: [Email flows, Phone, PKCE]
      operationId: authResend
      summary: Re-send a confirmation or change token
      description: |
        Re-sends the one-time token of a pending flow, named by `type`:

        | `type` | Re-sends | Needs |
        | --- | --- | --- |
        | `signup` | the email confirmation | `email` |
        | `email_change` | the email-change confirmation(s) | `email` (the *current* address; the pending one is read from `new_email`) |
        | `sms` | the phone confirmation OTP | `phone` |
        | `phone_change` | the phone-change OTP (sent to `new_phone`) | `phone` |

        Anything else is `400 validation_failed`. Supplying both identifiers, or the wrong one for
        the type, is also `400`.

        Nothing to re-send — unknown identifier, already-confirmed address, no pending change —
        answers `200 {}` all the same. `code_challenge` + `code_challenge_method` re-arm a PKCE
        flow for the email types.

        CAPTCHA applies. Buckets: `RATE_LIMIT_EMAIL_SENT` per IP, `RATE_LIMIT_SMS_SENT` for the
        phone types, plus the per-user send throttles. No authentication.
      security: []
      parameters:
        - $ref: '#/components/parameters/XJwtAud'
        - $ref: '#/components/parameters/RedirectToQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendParams'
      responses:
        '200':
          description: 'Sent, or nothing to send. `{}`, or `{"message_id": "..."}` for SMS.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendResponse'
        '400':
          description: |
            `validation_failed` — unsupported `type`, missing/ambiguous identifier, invalid email
            or phone, malformed PKCE parameters; `email_provider_disabled`;
            `phone_provider_disabled`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`captcha_failed`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`over_request_rate_limit`, `over_email_send_rate_limit`, `over_sms_send_rate_limit`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/v1/reauthenticate:
    get:
      tags: [Email flows, Phone]
      operationId: authReauthenticate
      summary: Send a reauthentication nonce
      description: |
        Sends a 6-digit nonce to the signed-in user, to be passed back as `nonce` on
        `PUT /user` when `SECURITY_UPDATE_PASSWORD_REQUIRE_REAUTHENTICATION` is on.

        The **email** is preferred when the account has both; a phone-only account gets an SMS and
        needs `DILION_AUTH_EXTERNAL_PHONE_ENABLED=true`. The response is always `{}`.

        Requires a **user access token**. Bucket: `RATE_LIMIT_EMAIL_SENT`, plus the per-user send
        throttles.
      responses:
        '200':
          description: 'Sent. Always the empty object `{}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyObject'
        '400':
          description: |
            `validation_failed` — the account has neither an email nor a phone;
            `phone_provider_disabled`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/NoAuthorization'
        '403':
          $ref: '#/components/responses/BadJwt'
        '422':
          description: '`email_not_confirmed` or `phone_not_confirmed`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`over_request_rate_limit`, `over_email_send_rate_limit`, `over_sms_send_rate_limit`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/v1/invite:
    post:
      tags: [Email flows, Admin]
      operationId: authInvite
      summary: Invite a user by email
      description: |
        Creates an unconfirmed account (if the address has none) and mails an invitation link,
        redeemed with `type=invite`. The response is the **user object**, so unlike the other mail
        endpoints this one *does* confirm whether the address existed — it is admin-only for
        exactly that reason.

        An address that is already confirmed answers `422 email_exists`.

        Requires a `service_role` JWT **or** a user access token holding `users.admin`.
        Bucket: `RATE_LIMIT_EMAIL_SENT`, plus the per-user `MAILER_MAX_FREQUENCY` throttle.
      parameters:
        - $ref: '#/components/parameters/XJwtAud'
        - $ref: '#/components/parameters/RedirectToQuery'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteParams'
      responses:
        '200':
          description: The invited user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: '`validation_failed` — missing or malformed email.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/NoAuthorization'
        '403':
          $ref: '#/components/responses/NotAdmin'
        '422':
          description: '`email_exists` — the address is already registered and confirmed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`over_request_rate_limit` or `over_email_send_rate_limit`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/v1/admin/generate_link:
    post:
      tags: [Admin, Email flows]
      operationId: authAdminGenerateLink
      summary: Generate an action link without sending mail
      description: |
        Mints the same one-time token the mail flows use and hands it back **instead of** (or
        alongside) emailing it — the escape hatch for deployments that own their own delivery.

        The response is the user object **flattened together with** `action_link`, `email_otp`,
        `hashed_token`, `verification_type` and `redirect_to`.

        `type` selects the flow: `signup`, `invite`, `magiclink`, `recovery`,
        `email_change_current`, `email_change_new`. A `magiclink` for an unknown address is
        silently rewritten to `signup`; `recovery` / `email_change_*` for an unknown address is
        `404 user_not_found`.

        Requires a `service_role` JWT **or** a user access token holding `users.admin`. Not rate
        limited (no mail is sent by this endpoint), but the per-user `MAILER_MAX_FREQUENCY`
        throttle still guards the token slot.
      parameters:
        - $ref: '#/components/parameters/XJwtAud'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateLinkParams'
      responses:
        '200':
          description: The user, plus the generated link and its token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateLinkResponse'
        '400':
          description: '`validation_failed` — missing/invalid email or unsupported `type`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/NoAuthorization'
        '403':
          $ref: '#/components/responses/NotAdmin'
        '404':
          description: '`user_not_found` — no account for a `recovery` / `email_change_*` link.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`email_exists` — a `signup`/`invite` link for a confirmed address; `weak_password`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: '`over_email_send_rate_limit` — the per-user token throttle.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/v1/authorize:
    get:
      tags: [External OAuth, PKCE]
      operationId: authExternalAuthorize
      summary: Start an external provider sign-in (redirects)
      description: |
        Creates a flow-state row and **redirects (302)** to the provider's authorization URL, with
        the flow-state id as the OAuth `state`.

        Any query parameter other than `provider`, `scopes`, `code_challenge`,
        `code_challenge_method`, `redirect_to` and `skip_http_redirect` is **forwarded to the
        provider** verbatim (that is how `prompt`, `login_hint`, `access_type` and friends reach it).

        `redirect_to` is validated against `URI_ALLOW_LIST` and stored on the flow state; it is
        where `/callback` will send the browser. Adding `code_challenge` +
        `code_challenge_method` makes the callback hand back `?code=…` instead of a fragment.

        Set `skip_http_redirect=true` (or send `Accept: application/json`) to get
        `200 {"url": "https://provider…"}` instead of the redirect — what supabase-js does when it
        opens the provider itself.

        A provider without a driver, or one whose `DILION_AUTH_EXTERNAL_<PROVIDER>_ENABLED` is
        false, answers `400 validation_failed` (`"Unsupported provider"`). No authentication, not
        rate limited.
      security: []
      parameters:
        - name: provider
          in: query
          required: true
          description: |
            Lower-cased provider key. Drivers exist for `apple`, `github`, `google` and `kakao`.
          schema:
            type: string
            examples: [google]
        - name: scopes
          in: query
          description: Space-separated extra scopes appended to the provider's defaults.
          schema:
            type: string
        - $ref: '#/components/parameters/CodeChallengeQuery'
        - $ref: '#/components/parameters/CodeChallengeMethodQuery'
        - $ref: '#/components/parameters/RedirectToQuery'
        - name: skip_http_redirect
          in: query
          description: '`true` returns the URL as JSON instead of redirecting.'
          schema:
            type: boolean
      responses:
        '200':
          description: 'Only with `skip_http_redirect=true` or `Accept: application/json`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedirectURLResponse'
        '302':
          description: Redirect to the provider's authorization endpoint.
          headers:
            Location:
              schema:
                type: string
        '400':
          description: |
            `validation_failed` — unknown, driverless or disabled provider, or malformed PKCE
            parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/v1/callback:
    get:
      tags: [External OAuth, PKCE]
      operationId: authExternalCallbackGet
      summary: External provider callback (redirects)
      description: |
        Where the provider sends the browser back. The `state` names the flow-state row created at
        `/authorize`; the `code` is exchanged for provider tokens, the user profile is fetched, and
        the account is created or linked.

        Always ends in a **302** to the flow's `redirect_to` (falling back to `SITE_URL`):

        - **implicit** → the session in the **fragment**, plus `provider_token` and (when the
          provider issued one) `provider_refresh_token` as extra fragment keys
        - **PKCE** → `?code=<auth_code>` in the query string; the provider tokens are parked on the
          flow state and come back from `POST /token?grant_type=pkce`
        - **failure** → `error`, `error_description` and `error_code` in **both** the query string
          and the fragment. A `state` that cannot even be loaded redirects to `SITE_URL` with
          status **303**.

        Never returns a session in a body. No authentication, not rate limited.
      security: []
      parameters:
        - name: state
          in: query
          required: true
          description: The flow-state id issued by `/authorize`.
          schema:
            type: string
            format: uuid
        - name: code
          in: query
          description: The provider's authorization code.
          schema:
            type: string
        - name: error
          in: query
          description: Set by the provider when the user declined; passed straight through.
          schema:
            type: string
        - name: error_description
          in: query
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the flow's `redirect_to` with the session, the code, or an error.
          headers:
            Location:
              schema:
                type: string
        '303':
          description: |
            Redirect to `SITE_URL` when the `state` is missing, malformed, unknown, expired or
            already used (`bad_oauth_state`, `bad_oauth_callback`, `flow_state_already_used`).
          headers:
            Location:
              schema:
                type: string
    post:
      tags: [External OAuth]
      operationId: authExternalCallbackPost
      summary: External provider callback (form_post)
      description: |
        Identical to the `GET` form, for providers that use `response_mode=form_post` — Apple,
        which also posts a one-shot `user` field carrying the name it will never send again.
        Parameters arrive as `application/x-www-form-urlencoded`.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExternalCallbackForm'
      responses:
        '302':
          description: Redirect to the flow's `redirect_to` with the session, the code, or an error.
          headers:
            Location:
              schema:
                type: string
        '303':
          description: Redirect to `SITE_URL` when the `state` cannot be resolved.
          headers:
            Location:
              schema:
                type: string

  /auth/v1/user/identities/authorize:
    get:
      tags: [External OAuth, PKCE]
      operationId: authLinkIdentity
      summary: Link another provider to the signed-in account (redirects)
      description: |
        The same flow as `GET /authorize`, except that the flow state records the **calling user**
        as the linking target: when the provider comes back, its identity is attached to that
        account instead of creating a new one.

        Requires `DILION_AUTH_SECURITY_MANUAL_LINKING_ENABLED=true`, otherwise
        `422 manual_linking_disabled`. An identity already linked elsewhere (or already on this
        account) answers `422 identity_already_exists` — on the `/callback` leg, so it arrives as
        an error redirect.

        Requires a **user access token**. Not rate limited.
      parameters:
        - name: provider
          in: query
          required: true
          schema:
            type: string
        - name: scopes
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/CodeChallengeQuery'
        - $ref: '#/components/parameters/CodeChallengeMethodQuery'
        - $ref: '#/components/parameters/RedirectToQuery'
        - name: skip_http_redirect
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: 'Only with `skip_http_redirect=true` or `Accept: application/json`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedirectURLResponse'
        '302':
          description: Redirect to the provider's authorization endpoint.
          headers:
            Location:
              schema:
                type: string
        '400':
          description: '`validation_failed` — unknown provider or malformed PKCE parameters.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/NoAuthorization'
        '403':
          $ref: '#/components/responses/BadJwt'
        '422':
          description: '`manual_linking_disabled`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/v1/user/identities/{identity_id}:
    delete:
      tags: [External OAuth]
      operationId: authUnlinkIdentity
      summary: Unlink an identity
      description: |
        Removes one identity from the signed-in account and answers `200 {}`.

        The account must keep at least one identity (`422 single_identity_not_deletable`), and the
        token's audience must match the request audience (`403 unexpected_audience`).

        Unlinking the `phone` identity also clears `phone` / `phone_confirmed_at`; unlinking any
        other one re-derives the account's primary email from the identities that remain.
        `app_metadata.providers` is re-synced either way.

        Requires a **user access token**. Not rate limited.
      parameters:
        - name: identity_id
          in: path
          required: true
          description: The identity row's UUID (the `identity_id` field, not `id`).
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 'Unlinked. The body is the empty object `{}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyObject'
        '401':
          $ref: '#/components/responses/NoAuthorization'
        '403':
          description: '`bad_jwt`, `user_not_found`, `user_banned`, or `unexpected_audience`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`validation_failed` — `identity_id` is not a UUID.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`single_identity_not_deletable` or `identity_not_found`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/v1/factors:
    post:
      tags: [MFA]
      operationId: authEnrollFactor
      summary: Enroll an MFA factor
      description: |
        Creates an **unverified** TOTP factor and returns its secret three ways — `secret` (base32),
        `uri` (`otpauth://`) and `qr_code` (an inline SVG). The factor only counts once
        `POST /factors/{factor_id}/verify` succeeds; unverified factors older than 5 minutes are
        swept.

        Guards: `MFA_MAX_ENROLLED_FACTORS` (default 10) and a hard cap of 10 **verified** factors,
        both `422 too_many_enrolled_mfa_factors`; a duplicate `friendly_name`,
        `422 mfa_factor_name_conflict`. If the user already has a verified factor, the calling
        session must itself be `aal2` — otherwise `403 insufficient_aal`.

        `factor_type` must be `totp`: `phone` and `webauthn` are recognised but not implemented
        (`422 mfa_phone_enroll_not_enabled` / `422 mfa_webauthn_enroll_not_enabled`), and anything
        else is `400 validation_failed`. TOTP enrollment additionally requires
        `DILION_AUTH_MFA_TOTP_ENROLL_ENABLED=true`.

        Requires a **user access token carrying a `session_id`**. Not rate limited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollFactorParams'
      responses:
        '200':
          description: The enrolled (unverified) factor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollFactorResponse'
        '400':
          description: '`validation_failed` — unknown `factor_type`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/NoAuthorization'
        '403':
          description: '`bad_jwt`, `user_not_found`, `user_banned`, or `insufficient_aal`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            `too_many_enrolled_mfa_factors`, `mfa_factor_name_conflict`,
            `mfa_totp_enroll_not_enabled`, `mfa_phone_enroll_not_enabled`,
            `mfa_webauthn_enroll_not_enabled`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/v1/factors/{factor_id}:
    parameters:
      - $ref: '#/components/parameters/FactorId'
    delete:
      tags: [MFA]
      operationId: authUnenrollFactor
      summary: Unenroll a factor
      description: |
        Deletes the factor and answers `{"id": "..."}`. Sessions that had reached `aal2` through it
        are downgraded, and the user is notified by mail.

        Removing a **verified** factor requires the calling session to be `aal2`
        (`422 insufficient_aal`). A factor that does not exist and one that belongs to someone else
        answer the identical `404 mfa_factor_not_found`.

        Requires a **user access token carrying a `session_id`**. Not rate limited.
      responses:
        '200':
          description: The unenrolled factor's id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnenrollFactorResponse'
        '401':
          $ref: '#/components/responses/NoAuthorization'
        '403':
          $ref: '#/components/responses/BadJwt'
        '404':
          description: '`mfa_factor_not_found`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`insufficient_aal`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/v1/factors/{factor_id}/challenge:
    parameters:
      - $ref: '#/components/parameters/FactorId'
    post:
      tags: [MFA]
      operationId: authChallengeFactor
      summary: Create an MFA challenge
      description: |
        Opens a 5-minute challenge against the factor and returns its id, to be passed to
        `.../verify`. The challenge is bound to the **caller's IP**: verifying from a different
        address is `422 mfa_ip_address_mismatch`.

        Requires `DILION_AUTH_MFA_TOTP_VERIFY_ENABLED=true`. Requires a **user access token
        carrying a `session_id`**. Bucket: `RATE_LIMIT_VERIFY`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChallengeFactorParams'
      responses:
        '200':
          description: The open challenge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeFactorResponse'
        '401':
          $ref: '#/components/responses/NoAuthorization'
        '403':
          $ref: '#/components/responses/BadJwt'
        '404':
          description: '`mfa_factor_not_found`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            `mfa_totp_verify_not_enabled`, `mfa_phone_verify_not_enabled`,
            `mfa_webauthn_verify_not_enabled`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/v1/factors/{factor_id}/verify:
    parameters:
      - $ref: '#/components/parameters/FactorId'
    post:
      tags: [MFA]
      operationId: authVerifyFactor
      summary: Verify an MFA challenge
      description: |
        Checks the TOTP code against the open challenge. On success, in one transaction:

        1. the challenge is marked verified and the factor becomes `verified` (first time only),
        2. a `totp` AMR claim is added to the session and the session is raised to **`aal2`**,
        3. the session's refresh token is rotated — the response carries the new one,
        4. every **other** session of the user below `aal2` is invalidated,
        5. the user's remaining **unverified** factors of the same type are deleted.

        The response is a full session envelope whose access token now reports `aal: "aal2"`.

        A wrong code is `422 mfa_verification_failed`; an expired challenge,
        `422 mfa_challenge_expired`; a challenge from a different IP,
        `422 mfa_ip_address_mismatch`.

        Requires a **user access token carrying a `session_id`**. Bucket: `RATE_LIMIT_VERIFY`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyFactorParams'
      responses:
        '200':
          description: A new session at `aal2`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '400':
          description: '`validation_failed` — empty `code`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/NoAuthorization'
        '403':
          $ref: '#/components/responses/BadJwt'
        '404':
          description: '`mfa_factor_not_found`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: |
            `mfa_verification_failed`, `mfa_challenge_expired`, `mfa_ip_address_mismatch`,
            `mfa_factor_not_found` (unknown `challenge_id`), `mfa_totp_verify_not_enabled`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/v1/admin/users/{user_id}/factors:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Admin, MFA]
      operationId: authAdminListFactors
      summary: List a user's MFA factors
      description: |
        Every factor of the user, verified or not. Recorded in the access log as a
        `USER_DETAIL_READ`.

        Requires a `service_role` JWT **or** a user access token holding `users.admin`.
      responses:
        '200':
          description: The user's factors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Factor'
        '401':
          $ref: '#/components/responses/NoAuthorization'
        '403':
          $ref: '#/components/responses/NotAdmin'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/v1/admin/users/{user_id}/factors/{factor_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/FactorId'
    put:
      tags: [Admin, MFA]
      operationId: authAdminUpdateFactor
      summary: Rename a user's MFA factor
      description: |
        Only `friendly_name` is applied — `phone` is accepted for upstream compatibility and
        ignored, since phone factors do not exist here. An empty/whitespace name is a no-op that
        still answers `200`. A name already used by another factor of the same user is
        `422 mfa_factor_name_conflict`.

        Requires a `service_role` JWT **or** a user access token holding `users.admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateFactorParams'
      responses:
        '200':
          description: The updated factor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Factor'
        '401':
          $ref: '#/components/responses/NoAuthorization'
        '403':
          $ref: '#/components/responses/NotAdmin'
        '404':
          description: '`user_not_found`, `mfa_factor_not_found`, or `validation_failed` for a non-UUID.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`mfa_factor_name_conflict`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Admin, MFA]
      operationId: authAdminDeleteFactor
      summary: Delete a user's MFA factor
      description: |
        Deletes the factor and downgrades any session that had reached `aal2` through it. Unlike
        the self-service unenroll there is no `aal2` requirement — the caller is already an admin.
        Answers with the deleted factor.

        Requires a `service_role` JWT **or** a user access token holding `users.admin`.
      responses:
        '200':
          description: The deleted factor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Factor'
        '401':
          $ref: '#/components/responses/NoAuthorization'
        '403':
          $ref: '#/components/responses/NotAdmin'
        '404':
          description: '`user_not_found`, `mfa_factor_not_found`, or `validation_failed` for a non-UUID.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/v1/passkeys/authentication/options:
    post:
      tags: [Passkeys]
      operationId: authPasskeyAuthenticationOptions
      summary: Begin a passkey login ceremony
      description: |
        Starts a **discoverable** (usernameless) WebAuthn login: no identifier is submitted, and
        the response carries the `PublicKeyCredentialRequestOptions` to hand to
        `navigator.credentials.get()`, together with the `challenge_id` to send back.

        Challenges expire after 5 minutes and are single-use. The request body is ignored except
        for `gotrue_meta_security.captcha_token` when CAPTCHA is enabled.

        Feature-flagged: `404 passkey_disabled` unless `DILION_AUTH_PASSKEY_ENABLED=true`.
        Bucket: `RATE_LIMIT_PASSKEY`. No authentication.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptchaOnlyParams'
      responses:
        '200':
          description: The WebAuthn request options.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyAuthenticationOptionsResponse'
        '404':
          $ref: '#/components/responses/PasskeyDisabled'
        '422':
          description: '`captcha_failed`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/v1/passkeys/authentication/verify:
    post:
      tags: [Passkeys]
      operationId: authPasskeyAuthenticationVerify
      summary: Finish a passkey login ceremony
      description: |
        Validates the assertion against the stored challenge, updates the credential's sign count
        and `last_used_at`, and grants a session (AMR method `webauthn`).

        Unverified email/phone on the resolved account are refused (`403 email_not_confirmed` /
        `403 phone_not_confirmed`), as is a banned user.

        **Deviation:** upstream leaves this endpoint unlimited; Dilion rate-limits it too — it is
        where a signature is checked and a session is minted.

        Feature-flagged: `404 passkey_disabled`. Bucket: `RATE_LIMIT_PASSKEY`. No authentication.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyVerifyParams'
      responses:
        '200':
          description: A new session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenResponse'
        '400':
          description: |
            `validation_failed` — missing `challenge_id` / `credential`;
            `webauthn_challenge_not_found` — unknown or already-used challenge;
            `webauthn_challenge_expired`; `webauthn_verification_failed`;
            `webauthn_credential_not_found`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: '`email_not_confirmed`, `phone_not_confirmed`, `user_banned`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/PasskeyDisabled'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/v1/passkeys/registration/options:
    post:
      tags: [Passkeys]
      operationId: authPasskeyRegistrationOptions
      summary: Begin passkey registration
      description: |
        Returns `PublicKeyCredentialCreationOptions` for `navigator.credentials.create()`, with the
        user's existing credentials listed as exclusions so the same authenticator cannot enroll
        twice. Challenge lifetime is 5 minutes.

        Refused for anonymous users (`403 no_authorization`) and SSO users
        (`422 validation_failed`). At 10 stored passkeys, `422 too_many_passkeys`. When the user
        has a verified MFA factor, the calling session must be `aal2`
        (`403 insufficient_aal`).

        Feature-flagged: `404 passkey_disabled`. Requires a **user access token**. Not rate limited.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmptyObject'
      responses:
        '200':
          description: The WebAuthn creation options.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyRegistrationOptionsResponse'
        '401':
          $ref: '#/components/responses/NoAuthorization'
        '403':
          description: '`bad_jwt`, `user_not_found`, `user_banned`, `no_authorization` (anonymous), `insufficient_aal`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/PasskeyDisabled'
        '422':
          description: '`too_many_passkeys`, or `validation_failed` for an SSO user.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/v1/passkeys/registration/verify:
    post:
      tags: [Passkeys]
      operationId: authPasskeyRegistrationVerify
      summary: Finish passkey registration
      description: |
        Validates the attestation and stores the credential. The 10-passkey cap is re-checked
        inside the transaction, so two parallel registrations cannot both slip past it.

        Feature-flagged: `404 passkey_disabled`. Requires a **user access token**. Not rate limited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyVerifyParams'
      responses:
        '200':
          description: The stored passkey's metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyMetadataResponse'
        '400':
          description: |
            `validation_failed`, `webauthn_challenge_not_found`, `webauthn_challenge_expired`,
            `webauthn_verification_failed`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/NoAuthorization'
        '403':
          $ref: '#/components/responses/BadJwt'
        '404':
          $ref: '#/components/responses/PasskeyDisabled'
        '422':
          description: '`too_many_passkeys` or `webauthn_credential_exists`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/v1/passkeys:
    get:
      tags: [Passkeys]
      operationId: authPasskeyList
      summary: List my passkeys
      description: |
        The signed-in user's credentials, newest first. Only metadata — the public key, sign count
        and AAGUID never leave the server.

        Feature-flagged: `404 passkey_disabled`. Requires a **user access token**. Not rate limited.
      responses:
        '200':
          description: The user's passkeys.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PasskeyListItem'
        '401':
          $ref: '#/components/responses/NoAuthorization'
        '403':
          $ref: '#/components/responses/BadJwt'
        '404':
          $ref: '#/components/responses/PasskeyDisabled'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/v1/passkeys/{passkey_id}:
    parameters:
      - $ref: '#/components/parameters/PasskeyId'
    patch:
      tags: [Passkeys]
      operationId: authPasskeyUpdate
      summary: Rename a passkey
      description: |
        Sets `friendly_name` (required, max 120 characters). No `aal2` requirement — renaming is
        not a credential change.

        Feature-flagged: `404 passkey_disabled`. Requires a **user access token**. Not rate limited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasskeyUpdateParams'
      responses:
        '200':
          description: The renamed passkey.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasskeyListItem'
        '400':
          description: '`validation_failed` — missing or over-long `friendly_name`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/NoAuthorization'
        '403':
          $ref: '#/components/responses/BadJwt'
        '404':
          description: '`passkey_disabled`, or `validation_failed` — unknown id / not this user''s.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Passkeys]
      operationId: authPasskeyDelete
      summary: Delete a passkey
      description: |
        Removes the credential and answers `204`. When the user has a verified MFA factor the
        calling session must be `aal2` (`403 insufficient_aal`).

        Feature-flagged: `404 passkey_disabled`. Requires a **user access token**. Not rate limited.
      responses:
        '204':
          description: Deleted.
        '401':
          $ref: '#/components/responses/NoAuthorization'
        '403':
          description: '`bad_jwt`, `user_not_found`, `user_banned`, `insufficient_aal`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: '`passkey_disabled`, or `validation_failed` — unknown id / not this user''s.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/v1/admin/users/{user_id}/passkeys:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Admin, Passkeys]
      operationId: authAdminPasskeyList
      summary: List a user's passkeys
      description: |
        Same metadata as the self-service list, for any user.

        **Not** gated by `DILION_AUTH_PASSKEY_ENABLED` — an operator must still be able to see and
        revoke credentials after the feature is switched off.

        Requires a `service_role` JWT **or** a user access token holding `users.admin`.
      responses:
        '200':
          description: The user's passkeys.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PasskeyListItem'
        '401':
          $ref: '#/components/responses/NoAuthorization'
        '403':
          $ref: '#/components/responses/NotAdmin'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/v1/admin/users/{user_id}/passkeys/{passkey_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/PasskeyId'
    delete:
      tags: [Admin, Passkeys]
      operationId: authAdminPasskeyDelete
      summary: Revoke a user's passkey
      description: |
        Deletes one credential of the named user and answers `204`. Not gated by the passkey
        feature flag.

        Requires a `service_role` JWT **or** a user access token holding `users.admin`.
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/NoAuthorization'
        '403':
          $ref: '#/components/responses/NotAdmin'
        '404':
          description: '`user_not_found`, or `validation_failed` — the passkey is unknown or not this user''s.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/v1/sso:
    post:
      tags: [SSO/SAML, PKCE]
      operationId: authSingleSignOn
      summary: Start a SAML sign-in (redirects)
      description: |
        Resolves the identity provider by **`provider_id` or `domain`** (exactly one; both is
        `400 validation_failed`, neither is `400 validation_failed`), builds a SAML
        `AuthnRequest`, stores a relay state, and **redirects (303)** the browser to the IdP.

        Send `skip_http_redirect: true` to get `200 {"url": "https://idp…"}` instead — for clients
        that navigate themselves.

        `redirect_to` is validated against `URI_ALLOW_LIST` and is where `/sso/saml/acs` will land
        the browser. `code_challenge` + `code_challenge_method` make that landing a PKCE
        `?code=…` rather than a fragment.

        Feature-flagged: `404 saml_provider_disabled` unless `DILION_AUTH_SAML_ENABLED=true`.
        CAPTCHA applies. Bucket: `RATE_LIMIT_SSO`. No authentication.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SingleSignOnParams'
      responses:
        '200':
          description: 'Only with `skip_http_redirect: true`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleSignOnResponse'
        '303':
          description: Redirect to the IdP's SSO endpoint.
          headers:
            Location:
              schema:
                type: string
        '400':
          description: |
            `validation_failed` — both or neither of `provider_id` / `domain`, or malformed PKCE
            parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            `saml_provider_disabled` (feature off), `sso_provider_not_found`,
            `sso_provider_disabled`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: '`captcha_failed`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/v1/sso/saml/metadata:
    get:
      tags: [SSO/SAML]
      operationId: authSamlMetadata
      summary: This service provider's SAML metadata
      description: |
        The SP metadata XML to hand to an identity provider. Served as `application/xml` with
        `Cache-Control: public, max-age=600`.

        Only the **signing** key descriptor is published: Dilion does not implement encrypted
        assertions, and advertising an encryption key it cannot use would make IdPs send
        assertions this server cannot decrypt. `AuthnRequestsSigned` is deliberately dropped, and
        the advertised NameID formats are `emailAddress` and `persistent`.

        `?download=true` adds `Content-Disposition: attachment; filename="metadata.xml"` and stamps
        a 5-year `validUntil`.

        Feature-flagged: `404 saml_provider_disabled`. No authentication, not rate limited.
      security: []
      parameters:
        - name: download
          in: query
          description: '`true` serves the document as a file attachment.'
          schema:
            type: boolean
      responses:
        '200':
          description: The SP metadata document.
          headers:
            Cache-Control:
              schema:
                type: string
            Content-Disposition:
              description: Present only with `download=true`.
              schema:
                type: string
          content:
            application/xml:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/SamlDisabled'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/v1/sso/saml/acs:
    post:
      tags: [SSO/SAML]
      operationId: authSamlAcs
      summary: SAML assertion consumer service (redirects)
      description: |
        The IdP posts the signed assertion here as `application/x-www-form-urlencoded`
        (`SAMLResponse` + `RelayState`). Both flows are supported:

        - **SP-initiated** — `RelayState` is the UUID of the relay state created by `POST /sso`.
        - **IdP-initiated** — `RelayState` is a URL (or empty); the provider is resolved from the
          assertion's issuer.

        On success the browser is **redirected (302)** to the flow's `redirect_to` with the session
        in the fragment, or with `?code=…` for a PKCE flow. Failures redirect (**303**) to
        `SITE_URL` carrying `error`, `error_code` and `error_description`.

        Encrypted assertions are **not** supported.

        Feature-flagged: `404 saml_provider_disabled`. No authentication (the IdP holds no bearer
        token). Bucket: `RATE_LIMIT_SSO` — upstream uses a separate `SAML_ASSERTION` limiter.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SamlAcsForm'
      responses:
        '302':
          description: Redirect to the flow's `redirect_to` with the session or the auth code.
          headers:
            Location:
              schema:
                type: string
        '303':
          description: |
            Redirect to `SITE_URL` with the failure in the query string and fragment —
            `saml_relay_state_not_found`, `saml_relay_state_expired`, `saml_idp_not_found`,
            `saml_assertion_no_user_id`, `saml_assertion_no_email`, `sso_provider_disabled`.
          headers:
            Location:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/SamlDisabled'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/v1/admin/sso/providers:
    get:
      tags: [Admin, SSO/SAML]
      operationId: authAdminListSSOProviders
      summary: List SSO providers
      description: |
        Every registered identity provider, wrapped in `{"items": [...]}`. `saml.metadata_xml` is
        **stripped** from list rows (it is large and static); read one provider to get it.

        Optional `resource_id` / `resource_id_prefix` filters match the provider's operator-chosen
        `resource_id`.

        Not gated by `DILION_AUTH_SAML_ENABLED`. Requires a `service_role` JWT **or** a user access
        token holding `users.admin`.
      parameters:
        - name: resource_id
          in: query
          description: Exact match on the provider's `resource_id`.
          schema:
            type: string
        - name: resource_id_prefix
          in: query
          description: Prefix match on the provider's `resource_id`.
          schema:
            type: string
      responses:
        '200':
          description: The registered providers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SSOProviderListResponse'
        '401':
          $ref: '#/components/responses/NoAuthorization'
        '403':
          $ref: '#/components/responses/NotAdmin'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Admin, SSO/SAML]
      operationId: authAdminCreateSSOProvider
      summary: Register a SAML identity provider
      description: |
        `type` must be `saml`. Supply exactly one of `metadata_xml` or `metadata_url` (which must
        be **HTTPS** and is fetched server-side). The metadata must be valid UTF-8, name an
        `EntityID` and describe exactly one `IDPSSODescriptor`.

        `domains` claims email domains for this provider; a domain already claimed elsewhere is
        `400 sso_domain_already_exists`. A duplicate `EntityID` is `422 saml_idp_already_exists`.

        `attribute_mapping.keys` maps assertion attributes onto user fields (`email` is required
        at assertion time). `name_id_format` must be unspecified or one of the four supported
        formats.

        Answers **201**. Requires a `service_role` JWT **or** a user access token holding
        `users.admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSSOProviderParams'
      responses:
        '201':
          description: The registered provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SSOProvider'
        '400':
          description: |
            `validation_failed` — wrong `type`, both/neither metadata source, non-HTTPS
            `metadata_url`, unsupported `name_id_format`, unparseable metadata;
            `sso_domain_already_exists`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/NoAuthorization'
        '403':
          $ref: '#/components/responses/NotAdmin'
        '422':
          description: '`saml_idp_already_exists` or `conflict`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: '`unexpected_failure`, or `saml_metadata_fetch_failed` when the URL cannot be read.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/v1/admin/sso/providers/{idp_id}:
    parameters:
      - $ref: '#/components/parameters/IdpId'
    get:
      tags: [Admin, SSO/SAML]
      operationId: authAdminGetSSOProvider
      summary: Get an SSO provider
      description: |
        The full provider, including `saml.metadata_xml`.

        Requires a `service_role` JWT **or** a user access token holding `users.admin`.
      responses:
        '200':
          description: The provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SSOProvider'
        '401':
          $ref: '#/components/responses/NoAuthorization'
        '403':
          $ref: '#/components/responses/NotAdmin'
        '404':
          $ref: '#/components/responses/SSOProviderNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Admin, SSO/SAML]
      operationId: authAdminUpdateSSOProvider
      summary: Update an SSO provider
      description: |
        Every field is optional; `type` may be omitted. Supplying new metadata replaces it — the
        `EntityID` it names must match the provider's (`422 saml_entity_id_mismatch`). Supplying
        `domains` replaces the claimed set; a domain owned by another provider is
        `400 sso_domain_already_exists`. `disabled` toggles the provider without deleting it —
        a disabled provider answers `404 sso_provider_disabled` at `POST /sso`.

        Requires a `service_role` JWT **or** a user access token holding `users.admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSSOProviderParams'
      responses:
        '200':
          description: The updated provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SSOProvider'
        '400':
          description: '`validation_failed`, `sso_domain_already_exists`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/NoAuthorization'
        '403':
          $ref: '#/components/responses/NotAdmin'
        '404':
          $ref: '#/components/responses/SSOProviderNotFound'
        '422':
          description: '`saml_entity_id_mismatch` or `conflict`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Admin, SSO/SAML]
      operationId: authAdminDeleteSSOProvider
      summary: Delete an SSO provider
      description: |
        Removes the provider and its domains, and answers with the deleted object (upstream's
        behaviour). Users created through it keep existing.

        Requires a `service_role` JWT **or** a user access token holding `users.admin`.
      responses:
        '200':
          description: The deleted provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SSOProvider'
        '401':
          $ref: '#/components/responses/NoAuthorization'
        '403':
          $ref: '#/components/responses/NotAdmin'
        '404':
          $ref: '#/components/responses/SSOProviderNotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/v1/oauth/clients/register:
    post:
      tags: [OAuth2 Server]
      operationId: authOAuthDynamicRegisterClient
      summary: Dynamic client registration (RFC 7591)
      description: |
        Registers a new OAuth client **without a credential** — RFC 7591 dynamic client
        registration. `redirect_uris` is required (max 10). `client_type` is inferred from
        `token_endpoint_auth_method` when omitted: `none` means a public client, anything else a
        confidential one. A confidential client's `client_secret` is returned **once, here** and
        never again — regenerate it through the admin surface if it is lost.

        `grant_types` defaults to `["authorization_code", "refresh_token"]`.

        Dynamic registration is on whenever the OAuth server is on (there is no separate flag yet);
        deployments that must not accept anonymous registrations should keep the OAuth server off.

        Feature-flagged: `404 feature_disabled`. Bucket: a dedicated per-IP limiter of 10
        registrations / 5 minutes. No authentication.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthClientRegisterParams'
      responses:
        '201':
          description: The registered client, with `client_secret` for a confidential client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthClientResponse'
        '400':
          description: |
            `validation_failed` — missing/malformed `redirect_uris`, more than 10 of them, or a
            `token_endpoint_auth_method` that contradicts `client_type`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: '`oauth_dynamic_client_registration_disabled`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/OAuthServerDisabled'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/v1/oauth/token:
    post:
      tags: [OAuth2 Server]
      operationId: authOAuthToken
      summary: OAuth 2.0 token endpoint
      description: |
        **This endpoint uses the RFC 6749 error body** — `{"error": "...", "error_description":
        "..."}` — and answers **HTTP 400** for every failure, whatever the OAuth error code says.
        It is the only endpoint on this surface that never emits the gotrue envelope.

        Accepts `application/x-www-form-urlencoded` (the RFC's encoding) or `application/json`.

        Client authentication, in order: HTTP **Basic** (`client_secret_basic`), then
        `client_id` + `client_secret` in the body (`client_secret_post`), then `client_id` alone
        for a public client (`none`). A client that cannot be authenticated is `invalid_client`.

        **`grant_type=authorization_code`** — redeems the `code` produced by the consent flow.
        Single-use, expires quickly, must match the client, the `redirect_uri` (when sent), the
        `resource` (when sent) and the PKCE `code_verifier`. When the authorization carried the
        `openid` scope the response also carries an `id_token`.

        **`grant_type=refresh_token`** — rotates an OAuth session's refresh token.

        A grant the client is not registered for is `unsupported_grant_type`.

        Feature-flagged: `404 feature_disabled` (that one *is* the gotrue envelope, since it is
        raised by the gate in front of the handler). Not rate limited.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAuthTokenParams'
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthTokenParams'
      responses:
        '200':
          description: The token response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenResponse'
        '400':
          description: |
            RFC 6749 error body: `invalid_request`, `invalid_client`, `invalid_grant`,
            `unsupported_grant_type`, `access_denied`, `server_error`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthErrorResponse'
        '404':
          $ref: '#/components/responses/OAuthServerDisabled'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/v1/oauth/authorize:
    get:
      tags: [OAuth2 Server, PKCE]
      operationId: authOAuthAuthorizeGet
      summary: OAuth 2.0 authorization endpoint (redirects)
      description: |
        Validates the client and `redirect_uri`, creates a pending authorization row, and
        **redirects (302)** the browser to the hosted consent page —
        `SITE_URL/authorize?authorization_id=<id>`. That page then drives
        `GET /oauth/authorizations/{authorization_id}` and
        `POST /oauth/authorizations/{authorization_id}/consent` with the end user's own access
        token.

        Parameters are read from the query string. Errors split by *when* they are detected:

        - **before** the client and `redirect_uri` are trusted (`client_id` missing/malformed,
          unknown client, unregistered `redirect_uri`) → a JSON error body, because bouncing to an
          unverified URI would be an open redirect.
        - **after** → RFC 6749 §4.1.2.1 error redirect to `redirect_uri` with `?error=…`,
          `error_description` and the original `state`.

        `response_type` defaults to and must be `code`; `scope` defaults to the server's default
        scope. `code_challenge` / `code_challenge_method` carry PKCE through to the token
        exchange; `nonce` lands in the `id_token`; `resource` is echoed and enforced at the token
        endpoint.

        Feature-flagged: `404 feature_disabled`. No authentication (the consent page supplies it).
        Not rate limited.
      security: []
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: redirect_uri
          in: query
          required: true
          description: Must be one of the client's registered redirect URIs.
          schema:
            type: string
        - name: response_type
          in: query
          description: Only `code` is supported. Defaults to `code`.
          schema:
            type: string
            enum: [code]
        - name: scope
          in: query
          description: 'Space-separated. Supported: `openid`, `profile`, `email`, `phone`, `offline_access`.'
          schema:
            type: string
        - name: state
          in: query
          description: Echoed back on the success and error redirects.
          schema:
            type: string
        - name: resource
          in: query
          description: RFC 8707 resource indicator; must match at the token endpoint if sent.
          schema:
            type: string
        - $ref: '#/components/parameters/CodeChallengeQuery'
        - $ref: '#/components/parameters/CodeChallengeMethodQuery'
        - name: nonce
          in: query
          description: OIDC nonce; carried into the `id_token`.
          schema:
            type: string
      responses:
        '302':
          description: |
            Redirect to the consent page, or — for a parameter error detected after the
            `redirect_uri` was verified — back to the client with `?error=…`.
          headers:
            Location:
              schema:
                type: string
        '400':
          description: |
            `validation_failed` — missing `client_id` / `redirect_uri`, or a `redirect_uri` that is
            not registered; `oauth_client_not_found`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/OAuthServerDisabled'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [OAuth2 Server, PKCE]
      operationId: authOAuthAuthorizePost
      summary: OAuth 2.0 authorization endpoint (form POST)
      description: |
        Identical to the `GET` form, with the parameters in an
        `application/x-www-form-urlencoded` body. RFC 6749 §3.1 permits `POST` here; upstream
        mounts `GET` only, so this is a Dilion addition.

        Feature-flagged: `404 feature_disabled`. No authentication.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthorizeParams'
      responses:
        '302':
          description: Redirect to the consent page, or an RFC 6749 error redirect.
          headers:
            Location:
              schema:
                type: string
        '400':
          description: '`validation_failed`, `oauth_client_not_found`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/OAuthServerDisabled'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/v1/oauth/userinfo:
    get:
      tags: [OAuth2 Server]
      operationId: authOAuthUserInfo
      summary: OIDC UserInfo
      description: |
        The claims the **session's granted scopes** allow, keyed by `sub`. The response is built
        from the scopes recorded on the OAuth session, not from the request:

        | Scope | Adds |
        | --- | --- |
        | *(none)* | `sub` only |
        | `email` | `email`, `email_verified` |
        | `profile` | `name`, `picture`, `preferred_username`, `updated_at`, `user_metadata` |
        | `phone` | `phone`, `phone_verified` |

        A token that is not an OAuth-server session (an ordinary Dilion access token) gets `sub`
        alone.

        Feature-flagged: `404 feature_disabled`. Requires a **user access token**. Not rate limited.
      responses:
        '200':
          description: The UserInfo claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
        '401':
          $ref: '#/components/responses/NoAuthorization'
        '403':
          $ref: '#/components/responses/BadJwt'
        '404':
          $ref: '#/components/responses/OAuthServerDisabled'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/v1/oauth/authorizations/{authorization_id}:
    parameters:
      - $ref: '#/components/parameters/AuthorizationId'
    get:
      tags: [OAuth2 Server]
      operationId: authOAuthGetAuthorization
      summary: Read a pending authorization (consent page)
      description: |
        What the hosted consent page calls with the **end user's** access token to render "App X
        wants access to …". The call also **claims** the pending authorization for that user.

        If the user already granted this client every requested scope, the authorization is
        auto-approved and the response is `{"redirect_url": "…?code=…&state=…"}` instead of the
        details object — the page then simply navigates there.

        The `Origin` header, when present, must match `SITE_URL`. An authorization claimed by a
        different user answers `404 oauth_authorization_not_found`.

        Feature-flagged: `404 feature_disabled`. Requires a **user access token**. Not rate limited.
      responses:
        '200':
          description: The authorization details, or an auto-approval redirect URL.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AuthorizationDetailsResponse'
                  - $ref: '#/components/schemas/ConsentResponse'
        '400':
          description: '`validation_failed` — missing `authorization_id` or a disallowed `Origin`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/NoAuthorization'
        '403':
          $ref: '#/components/responses/BadJwt'
        '404':
          description: '`feature_disabled`, or `oauth_authorization_not_found` — unknown, no longer pending, or another user''s.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/v1/oauth/authorizations/{authorization_id}/consent:
    parameters:
      - $ref: '#/components/parameters/AuthorizationId'
    post:
      tags: [OAuth2 Server]
      operationId: authOAuthConsent
      summary: Approve or deny an authorization
      description: |
        The consent page's decision, with the **end user's** access token.

        - `approve` — mints the authorization code, records a durable consent for
          (user, client, scopes), and returns `{"redirect_url": "…?code=…&state=…"}`.
        - `deny` — marks the authorization denied and returns a `redirect_url` carrying
          `?error=access_denied&error_description=User+denied+the+request`.

        Either way the page just navigates to `redirect_url`. The authorization must still be
        pending and must belong to the calling user.

        Feature-flagged: `404 feature_disabled`. Requires a **user access token**. Not rate limited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentRequest'
      responses:
        '200':
          description: Where to send the browser next.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentResponse'
        '400':
          description: '`validation_failed` — `action` is not `approve`/`deny`, or a disallowed `Origin`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/NoAuthorization'
        '403':
          $ref: '#/components/responses/BadJwt'
        '404':
          description: '`feature_disabled` or `oauth_authorization_not_found`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/v1/user/oauth/grants:
    get:
      tags: [OAuth2 Server]
      operationId: authListOAuthGrants
      summary: List my OAuth grants
      description: |
        The third-party clients the signed-in user has consented to, with the scopes granted and
        when. Clients that have since been deleted are skipped.

        Feature-flagged: `404 feature_disabled`. Requires a **user access token**. Not rate limited.
      responses:
        '200':
          description: The user's active grants.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserOAuthGrantResponse'
        '401':
          $ref: '#/components/responses/NoAuthorization'
        '403':
          $ref: '#/components/responses/BadJwt'
        '404':
          $ref: '#/components/responses/OAuthServerDisabled'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [OAuth2 Server]
      operationId: authRevokeOAuthGrant
      summary: Revoke my grant to a client
      description: |
        Revokes the consent for one client and **kills every session that client holds** for this
        user. Answers `204`. A client with no active grant is `404 oauth_consent_not_found`.

        Feature-flagged: `404 feature_disabled`. Requires a **user access token**. Not rate limited.
      parameters:
        - name: client_id
          in: query
          required: true
          description: The client whose grant is revoked.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Revoked.
        '400':
          description: '`validation_failed` — missing or malformed `client_id`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/NoAuthorization'
        '403':
          $ref: '#/components/responses/BadJwt'
        '404':
          description: '`feature_disabled` or `oauth_consent_not_found`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/v1/admin/oauth/clients:
    get:
      tags: [Admin, OAuth2 Server]
      operationId: authAdminListOAuthClients
      summary: List OAuth clients
      description: |
        Every registered client, wrapped in `{"clients": [...]}`. Secrets are never returned —
        only their hash is stored.

        Feature-flagged **before** the admin gate: `404 feature_disabled` unless
        `DILION_AUTH_OAUTH_SERVER_ENABLED=true`. Requires a `service_role` JWT **or** a user access
        token holding `users.admin`.
      responses:
        '200':
          description: The registered clients.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthClientListResponse'
        '401':
          $ref: '#/components/responses/NoAuthorization'
        '403':
          $ref: '#/components/responses/NotAdmin'
        '404':
          $ref: '#/components/responses/OAuthServerDisabled'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Admin, OAuth2 Server]
      operationId: authAdminRegisterOAuthClient
      summary: Register an OAuth client
      description: |
        The operator-driven twin of `POST /oauth/clients/register`; the row is marked
        `registration_type: manual`. A confidential client's `client_secret` is returned **once,
        here**.

        Answers **201**. Feature-flagged: `404 feature_disabled`. Requires a `service_role` JWT
        **or** a user access token holding `users.admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthClientRegisterParams'
      responses:
        '201':
          description: The registered client, with `client_secret` for a confidential client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthClientResponse'
        '400':
          description: '`validation_failed` — bad `redirect_uris`, grant types or auth method.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/NoAuthorization'
        '403':
          $ref: '#/components/responses/NotAdmin'
        '404':
          $ref: '#/components/responses/OAuthServerDisabled'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/v1/admin/oauth/clients/{client_id}:
    parameters:
      - $ref: '#/components/parameters/OAuthClientId'
    get:
      tags: [Admin, OAuth2 Server]
      operationId: authAdminGetOAuthClient
      summary: Get an OAuth client
      description: |
        Feature-flagged: `404 feature_disabled`. Requires a `service_role` JWT **or** a user access
        token holding `users.admin`.
      responses:
        '200':
          description: The client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthClientResponse'
        '400':
          description: '`validation_failed` — `client_id` is not a UUID.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/NoAuthorization'
        '403':
          $ref: '#/components/responses/NotAdmin'
        '404':
          description: '`feature_disabled` or `oauth_client_not_found`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Admin, OAuth2 Server]
      operationId: authAdminUpdateOAuthClient
      summary: Update an OAuth client
      description: |
        A **sparse** update: only the fields present in the body are applied, and an entirely empty
        body is `400 validation_failed`. `client_type` cannot be changed; a
        `token_endpoint_auth_method` that contradicts the stored `client_type` is rejected.

        Feature-flagged: `404 feature_disabled`. Requires a `service_role` JWT **or** a user access
        token holding `users.admin`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthClientUpdateParams'
      responses:
        '200':
          description: The updated client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthClientResponse'
        '400':
          description: |
            `validation_failed` — no fields supplied, malformed `redirect_uris`, or an auth method
            that does not fit the client type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/NoAuthorization'
        '403':
          $ref: '#/components/responses/NotAdmin'
        '404':
          description: '`feature_disabled` or `oauth_client_not_found`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Admin, OAuth2 Server]
      operationId: authAdminDeleteOAuthClient
      summary: Delete an OAuth client
      description: |
        One transaction: every consent for the client is revoked, every session it holds is
        deleted, and the client row is **soft** deleted. Answers `204`.

        Feature-flagged: `404 feature_disabled`. Requires a `service_role` JWT **or** a user access
        token holding `users.admin`.
      responses:
        '204':
          description: Deleted.
        '400':
          description: '`validation_failed` — `client_id` is not a UUID.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/NoAuthorization'
        '403':
          $ref: '#/components/responses/NotAdmin'
        '404':
          description: '`feature_disabled` or `oauth_client_not_found`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/v1/admin/oauth/clients/{client_id}/regenerate_secret:
    parameters:
      - $ref: '#/components/parameters/OAuthClientId'
    post:
      tags: [Admin, OAuth2 Server]
      operationId: authAdminRegenerateOAuthClientSecret
      summary: Regenerate a client secret
      description: |
        Replaces the stored secret hash and returns the new plaintext **once**. The old secret
        stops working immediately. Public clients have no secret
        (`400 validation_failed`).

        Feature-flagged: `404 feature_disabled`. Requires a `service_role` JWT **or** a user access
        token holding `users.admin`.
      responses:
        '200':
          description: The client, with the new `client_secret`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthClientResponse'
        '400':
          description: '`validation_failed` — non-UUID `client_id`, or a public client.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/NoAuthorization'
        '403':
          $ref: '#/components/responses/NotAdmin'
        '404':
          description: '`feature_disabled` or `oauth_client_not_found`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/v1/admin/users:
    get:
      tags: [Admin]
      operationId: authAdminListUsers
      summary: List users
      description: |
        gotrue's `page` / `per_page` pagination — **not** Dilion's cursor envelope. The body carries
        `{"users":[…],"aud":"…"}` and the page links live in the `Link` and `X-Total-Count` response
        headers.

        Recorded in Dilion's access log as a `USER_LIST_READ` at `AccessFull`, with the ids
        actually returned on this page as the subject manifest — so "who read the record of user X"
        stays answerable.

        Requires a `service_role` JWT **or** a user access token whose actor holds the
        `users.admin` RBAC permission. Not rate limited.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/XJwtAud'
      responses:
        '200':
          description: One page of users.
          headers:
            X-Total-Count:
              description: Total number of users in this audience.
              schema:
                type: integer
                format: int64
            Link:
              description: |
                RFC 5988 page links, e.g.
                `<http://…/auth/v1/admin/users?page=2>; rel="next", <http://…?page=7>; rel="last"`.
                `rel="next"` is omitted on the last page.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminListUsersResponse'
        '400':
          description: '`validation_failed` — bad `page` / `per_page`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/NoAuthorization'
        '403':
          $ref: '#/components/responses/NotAdmin'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Admin]
      operationId: authAdminCreateUser
      summary: Create a user
      description: |
        Creates a user and its `email` identity. Unlike `/signup` this does **not** open a session,
        the address is only confirmed when `email_confirm` is true, and `role`, `aud`,
        `app_metadata` and `ban_duration` may be set directly. `password` is optional.

        **Phone users are not supported here** (`422 validation_failed`) even though `POST /signup`
        creates them — the admin create path has no phone branch.

        Requires a `service_role` JWT **or** a user access token whose actor holds the
        `users.admin` RBAC permission. Not rate limited.
      parameters:
        - $ref: '#/components/parameters/XJwtAud'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserParams'
      responses:
        '200':
          description: The created user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: '`validation_failed` — malformed email, id or `ban_duration`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/NoAuthorization'
        '403':
          $ref: '#/components/responses/NotAdmin'
        '422':
          description: |
            `validation_failed` — neither email nor phone, or a phone was supplied;
            `email_exists`; `weak_password`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/v1/admin/users/{user_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Admin]
      operationId: authAdminGetUser
      summary: Get a user by id
      description: |
        Recorded in the access log as a `USER_DETAIL_READ` at `AccessFull` — this surface returns
        real email addresses, unlike the masked management plane.

        Requires a `service_role` JWT **or** a user access token whose actor holds the
        `users.admin` RBAC permission.
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/NoAuthorization'
        '403':
          $ref: '#/components/responses/NotAdmin'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Admin]
      operationId: authAdminUpdateUser
      summary: Update a user by id
      description: |
        `user_metadata` and `app_metadata` are **merged** (a `null` value deletes the key).
        Setting `password` (including to `""`, which clears it) or applying a ban revokes **all**
        of that user's sessions. `ban_duration` takes a Go duration (`"24h"`) or `"none"` to lift a
        ban. `email_confirm` alone confirms a pending address. An empty change set answers `200`
        with the unchanged user.

        Requires a `service_role` JWT **or** a user access token whose actor holds the
        `users.admin` RBAC permission.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserParams'
      responses:
        '200':
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: '`validation_failed` — invalid email or `ban_duration`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/NoAuthorization'
        '403':
          $ref: '#/components/responses/NotAdmin'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '422':
          description: '`email_exists`, `weak_password`, `validation_failed`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Admin]
      operationId: authAdminDeleteUser
      summary: Delete a user by id
      description: |
        One transaction: a `user.deleted` event is written to the privacy outbox **first and
        unconditionally**, then the user's sessions are deleted and refresh tokens revoked, then
        the account itself is removed — hard delete by default, or soft delete (`deleted_at` set,
        email/phone obfuscated to release the unique constraints) when
        `should_soft_delete` is true. The downstream erasure is asynchronous: the privacy engine
        picks the outbox row up and turns it into a `DELETION` request, so this call does not wait
        for external systems.

        Deviation: the response is `200 {}` (upstream's implementation behaviour, which
        supabase-js is written against), not a user object.

        `should_soft_delete` is read from the **JSON body** only (there is no query form); an empty
        body is accepted and means "all defaults", i.e. a hard delete.

        Requires a `service_role` JWT **or** a user access token whose actor holds the
        `users.admin` RBAC permission.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserDeleteParams'
      responses:
        '200':
          description: 'Deleted. The body is the empty object `{}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmptyObject'
        '401':
          $ref: '#/components/responses/NoAuthorization'
        '403':
          $ref: '#/components/responses/NotAdmin'
        '404':
          $ref: '#/components/responses/UserNotFound'
        '409':
          description: '`conflict` — a `BeforeUserDelete` hook vetoed the deletion.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /auth/v1/admin/audit:
    get:
      tags: [Admin]
      operationId: authAdminAuditLog
      summary: Read the audit log
      description: |
        **Dilion extension shaped like upstream.** The rows come from `dilion_audit.events` — the
        access log the whole platform writes — projected into gotrue's
        `auth.audit_log_entries` body, so a client written against upstream's admin audit endpoint
        keeps working.

        Same `page` / `per_page` pagination and the same `Link` / `X-Total-Count` headers as
        `GET /admin/users`. Newest first.

        The `query` filter takes **one** `scope:value` term:

        | Term | Matches |
        | --- | --- |
        | `author:<text>` | the actor id, substring, case-insensitive |
        | `action:<text>` | the action name, substring — plus any Dilion action whose upstream projection contains the text |
        | `type:<text>` | the upstream `log_type` of the mapped actions |

        Anything else is `400 validation_failed`. Reading the log is deliberately **not** itself
        audited: an access event per audit read would recurse without adding evidence.

        Requires a `service_role` JWT **or** a user access token whose actor holds the
        `users.admin` RBAC permission.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: query
          in: query
          description: 'One `scope:value` term — `author:`, `action:` or `type:`.'
          schema:
            type: string
            examples: ['action:user']
      responses:
        '200':
          description: One page of audit entries.
          headers:
            X-Total-Count:
              schema:
                type: integer
                format: int64
            Link:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLogEntry'
        '400':
          description: '`validation_failed` — bad pagination or an unknown query scope.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/NoAuthorization'
        '403':
          $ref: '#/components/responses/NotAdmin'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        `Authorization: Bearer <token>`.

        - The self-service routes (`/user`, `/logout`, `/reauthenticate`, `/user/identities/*`,
          `/factors/*`, `/passkeys`, `/oauth/userinfo`, `/oauth/authorizations/*`,
          `/user/oauth/grants`) want the **user access token** returned by `/signup`, `/token`,
          `/verify` or a passkey login.
        - `/auth/v1/admin/*` and `/auth/v1/invite` want a `service_role` JWT, or a user access
          token whose actor holds the `users.admin` RBAC permission.
        - `POST /auth/v1/oauth/token` authenticates the **client**, not a user: HTTP Basic
          (`client_secret_basic`), body credentials (`client_secret_post`), or nothing at all for a
          public client.

  parameters:
    UserId:
      name: user_id
      in: path
      required: true
      description: The user's UUID. A non-UUID answers `404 validation_failed`.
      schema:
        type: string
        format: uuid
    FactorId:
      name: factor_id
      in: path
      required: true
      description: |
        The factor's UUID. Unknown, malformed, and "belongs to another user" all answer the
        identical `404 mfa_factor_not_found`.
      schema:
        type: string
        format: uuid
    PasskeyId:
      name: passkey_id
      in: path
      required: true
      description: The passkey's UUID.
      schema:
        type: string
        format: uuid
    IdpId:
      name: idp_id
      in: path
      required: true
      description: |
        The provider's UUID, **or** `resource_<resource_id>` to address it by the operator-chosen
        resource id.
      schema:
        type: string
        examples: ['resource_okta-prod']
    OAuthClientId:
      name: client_id
      in: path
      required: true
      description: The OAuth client's UUID. A non-UUID answers `400 validation_failed`.
      schema:
        type: string
        format: uuid
    AuthorizationId:
      name: authorization_id
      in: path
      required: true
      description: The opaque 32-character id minted by `/oauth/authorize`.
      schema:
        type: string
    XJwtAud:
      name: X-JWT-AUD
      in: header
      required: false
      description: |
        Overrides the audience the request operates in. Defaults to `authenticated`.
      schema:
        type: string
        default: authenticated
    RedirectToQuery:
      name: redirect_to
      in: query
      required: false
      description: |
        Where to send the browser after the flow. Validated against `URI_ALLOW_LIST`; an
        unlisted value silently falls back to the `Referer` header and then to `SITE_URL`.
        The mail/SMS endpoints also accept it in the JSON body, which takes precedence.
      schema:
        type: string
        format: uri
    CodeChallengeQuery:
      name: code_challenge
      in: query
      required: false
      description: |
        RFC 7636 challenge, 43–128 characters from `[a-zA-Z0-9._~-]`. Must be sent together with
        `code_challenge_method`.
      schema:
        type: string
        minLength: 43
        maxLength: 128
    CodeChallengeMethodQuery:
      name: code_challenge_method
      in: query
      required: false
      schema:
        type: string
        enum: [s256, plain]
    Page:
      name: page
      in: query
      description: 1-based page number.
      schema:
        type: integer
        format: int64
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      description: Page size.
      schema:
        type: integer
        format: int64
        minimum: 1
        default: 50

  responses:
    NoAuthorization:
      description: '`no_authorization` — missing or malformed `Authorization: Bearer` header.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadJwt:
      description: |
        `bad_jwt` — the token failed verification; `user_not_found` — its `sub` names no live user;
        `user_banned`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotAdmin:
      description: |
        `not_admin` — the caller is neither a `service_role` JWT nor a user holding `users.admin`;
        `bad_jwt` — the token failed verification.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UserNotFound:
      description: '`user_not_found`, or `validation_failed` when `user_id` is not a UUID.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SSOProviderNotFound:
      description: '`sso_provider_not_found` — unknown id, resource id, or a non-UUID.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PasskeyDisabled:
      description: |
        `passkey_disabled` — `DILION_AUTH_PASSKEY_ENABLED` is false. Upstream chose **404** so a
        deployment without passkeys is indistinguishable from one that predates the feature.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    OAuthServerDisabled:
      description: '`feature_disabled` — `DILION_AUTH_OAUTH_SERVER_ENABLED` is false.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SamlDisabled:
      description: '`saml_provider_disabled` — `DILION_AUTH_SAML_ENABLED` is false.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: |
        `over_request_rate_limit` — the endpoint's per-IP bucket is empty. Mail- and SMS-sending
        endpoints may instead answer `over_email_send_rate_limit` / `over_sms_send_rate_limit`,
        which are the per-**user** throttles and carry the seconds remaining in `msg`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: |
        `unexpected_failure`. `request_timeout` (504) is the sibling case, raised when a request
        exceeds `API_MAX_REQUEST_DURATION`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      title: ErrorResponse
      description: |
        gotrue's error body — the shape of **every** failure on this surface except
        `POST /oauth/token` and the parameter errors of `grant_type=id_token`.

        The field names are part of the compatibility contract: note `msg`, not `message`, and
        `code` carrying the **HTTP status as a number**.
      properties:
        code:
          type: integer
          description: The HTTP status code, repeated in the body.
          examples: [400]
        error_code:
          type: string
          description: Machine-readable code. Omitted when empty.
          examples: [validation_failed]
        msg:
          type: string
          description: Human-readable message.
          examples: ['Signup requires a valid password']
        weak_password:
          type: object
          description: |
            Present only on `422 weak_password`. `reasons` is upstream's exact vocabulary:
            `length`, `characters`, `pwned`.
          properties:
            message:
              type: string
            reasons:
              type: array
              items:
                type: string
                enum: [length, characters, pwned]
      required: [code, msg]

    OAuthErrorResponse:
      type: object
      title: OAuthErrorResponse
      description: |
        RFC 6749 §5.2 error body. Used by `POST /auth/v1/oauth/token` (always with HTTP 400,
        whatever the code) and by the parameter/verification failures of
        `POST /auth/v1/token?grant_type=id_token`.
      properties:
        error:
          type: string
          description: |
            `invalid_request`, `invalid_client`, `invalid_grant`, `unsupported_grant_type`,
            `access_denied` or `server_error` at `/oauth/token`; `invalid request` (with a space,
            upstream's spelling) for the `id_token` grant.
          examples: [invalid_grant]
        error_description:
          type: string
          examples: ['Invalid authorization code']
      required: [error]

    EmptyObject:
      type: object
      title: EmptyObject
      description: The empty object `{}` — a deliberate non-answer, so the endpoint reveals nothing.
      additionalProperties: true

    MessageResponse:
      type: object
      title: MessageResponse
      description: |
        `POST /verify`'s answer to the first half of a secure email change. Note that `code` is a
        **string** here, unlike `ErrorResponse.code`.
      properties:
        msg:
          type: string
          examples: ['Confirmation link accepted. Please proceed to confirm link sent to the other email']
        code:
          type: string
          examples: ['200']

    SendResponse:
      type: object
      title: SendResponse
      description: |
        The body of an OTP/magic-link send: `{}`, or `{"message_id": "..."}` when the SMS provider
        returned an id. Never says whether the identifier exists.
      properties:
        message_id:
          type: string
          description: The provider's message id, when one was returned.

    RedirectURLResponse:
      type: object
      title: RedirectURLResponse
      description: |
        The JSON alternative to a redirect, returned by `/authorize` and
        `/user/identities/authorize` with `skip_http_redirect=true` or
        `Accept: application/json`.
      properties:
        url:
          type: string
          format: uri
      required: [url]

    HealthCheckResponse:
      type: object
      title: HealthCheckResponse
      properties:
        version:
          type: string
          examples: ['0.1.0']
        name:
          type: string
          description: Always `GoTrue` — clients match on it.
          examples: [GoTrue]
        description:
          type: string
          examples: ['GoTrue is a user registration and authentication API']
      required: [version, name, description]

    Settings:
      type: object
      title: Settings
      description: The `GET /settings` body — the deployment's public capability report.
      properties:
        external:
          type: object
          description: |
            One boolean per provider slot, named exactly as upstream names them. `email` and
            `phone` are providers here too, and `anonymous_users` rides along.
            A `true` here only means the flag is set: only `apple`, `github`, `google` and `kakao`
            have a driver.
          properties:
            anonymous_users: { type: boolean }
            apple: { type: boolean }
            azure: { type: boolean }
            bitbucket: { type: boolean }
            discord: { type: boolean }
            facebook: { type: boolean }
            snapchat: { type: boolean }
            figma: { type: boolean }
            fly: { type: boolean }
            github: { type: boolean }
            gitlab: { type: boolean }
            google: { type: boolean }
            keycloak: { type: boolean }
            kakao: { type: boolean }
            linkedin: { type: boolean }
            linkedin_oidc: { type: boolean }
            notion: { type: boolean }
            spotify: { type: boolean }
            slack: { type: boolean }
            slack_oidc: { type: boolean }
            workos: { type: boolean }
            twitch: { type: boolean }
            twitter: { type: boolean }
            email: { type: boolean }
            phone: { type: boolean }
            zoom: { type: boolean }
        disable_signup:
          type: boolean
        mailer_autoconfirm:
          type: boolean
          description: When true, `/signup` returns a session instead of a bare user.
        phone_autoconfirm:
          type: boolean
        sms_provider:
          type: string
          description: '`SMS_PROVIDER`, verbatim. Only `twilio` has a driver.'
          examples: [twilio]
        saml_enabled:
          type: boolean
        saml_private_key_next_configured:
          type: boolean
          description: Whether a rotation key is staged.
        passkeys_enabled:
          type: boolean
      required:
        - external
        - disable_signup
        - mailer_autoconfirm
        - phone_autoconfirm
        - sms_provider
        - saml_enabled
        - saml_private_key_next_configured
        - passkeys_enabled

    JWKSet:
      type: object
      title: JWKSet
      properties:
        keys:
          type: array
          description: |
            The public ES256 keys. **Empty** on the symmetric-only (HS256 `JWT_SECRET`) path — the
            shared secret cannot be published.
          items:
            type: object
            description: A public JWK — `kid`, `kty`, `crv`, `x`, `y`, `alg`, `use`, `key_ops`.
            additionalProperties: true
      required: [keys]

    OpenIDConfiguration:
      type: object
      title: OpenIDConfiguration
      description: |
        The OIDC Discovery / RFC 8414 metadata document. One structure serves both well-known
        paths.
      properties:
        issuer:
          type: string
          description: '`JWT_ISSUER`, or `SITE_URL + /auth/v1` when unset.'
        authorization_endpoint:
          type: string
        token_endpoint:
          type: string
        jwks_uri:
          type: string
        userinfo_endpoint:
          type: string
        registration_endpoint:
          type: string
          description: Emitted only while dynamic client registration can actually be used.
        scopes_supported:
          type: array
          items:
            type: string
          examples: [['openid', 'profile', 'email', 'phone', 'offline_access']]
        response_types_supported:
          type: array
          items:
            type: string
          examples: [['code']]
        response_modes_supported:
          type: array
          items:
            type: string
          examples: [['query']]
        grant_types_supported:
          type: array
          items:
            type: string
          examples: [['authorization_code', 'refresh_token']]
        subject_types_supported:
          type: array
          items:
            type: string
          examples: [['public']]
        id_token_signing_alg_values_supported:
          type: array
          description: |
            What this deployment can actually verify — `["ES256"]` with a key set, `["HS256"]` on
            the symmetric-only path, both during a rotation.
          items:
            type: string
        token_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
          examples: [['client_secret_basic', 'client_secret_post', 'none']]
        claims_supported:
          type: array
          items:
            type: string
        code_challenge_methods_supported:
          type: array
          items:
            type: string
          examples: [['S256', 'plain']]
      required:
        - issuer
        - authorization_endpoint
        - token_endpoint
        - jwks_uri
        - response_types_supported
        - grant_types_supported
        - subject_types_supported
        - id_token_signing_alg_values_supported
        - token_endpoint_auth_methods_supported
        - code_challenge_methods_supported

    Identity:
      type: object
      title: Identity
      description: |
        Note the deliberately crossed field names, required by gotrue-js: the row's primary key is
        exposed as `identity_id`, and the provider-scoped id as `id`.
      properties:
        identity_id:
          type: string
          format: uuid
        id:
          type: string
          description: The provider's id for this user (the user's UUID for `email` / `phone`).
        user_id:
          type: string
          format: uuid
        identity_data:
          type: object
          additionalProperties: true
          description: |
            `{sub, email, email_verified, phone_verified}` for `email`; the provider's profile
            claims for an external one.
        provider:
          type: string
          examples: [email]
        last_sign_in_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        email:
          type: string
      required: [identity_id, id, user_id, provider, created_at, updated_at]

    User:
      type: object
      title: User
      description: |
        gotrue's user representation. Optional fields are **omitted** (not `null`) when empty —
        the Go struct tags carry `omitempty`, so this deliberately breaks Dilion's own
        "nullable, never absent" convention in favour of upstream compatibility.
      properties:
        id:
          type: string
          format: uuid
        aud:
          type: string
          examples: [authenticated]
        role:
          type: string
          examples: [authenticated]
        email:
          type: string
        email_confirmed_at:
          type: string
          format: date-time
        invited_at:
          type: string
          format: date-time
        phone:
          type: string
          description: E.164 without the leading `+`, as gotrue stores it.
        phone_confirmed_at:
          type: string
          format: date-time
        confirmation_sent_at:
          type: string
          format: date-time
        confirmed_at:
          type: string
          format: date-time
          description: Generated column — `least(email_confirmed_at, phone_confirmed_at)`.
        recovery_sent_at:
          type: string
          format: date-time
        new_email:
          type: string
          description: An email change awaiting confirmation.
        email_change_sent_at:
          type: string
          format: date-time
        new_phone:
          type: string
          description: A phone change awaiting its OTP.
        phone_change_sent_at:
          type: string
          format: date-time
        reauthentication_sent_at:
          type: string
          format: date-time
        last_sign_in_at:
          type: string
          format: date-time
        app_metadata:
          type: object
          additionalProperties: true
          description: 'Server-owned claims, e.g. `{"provider":"email","providers":["email"]}`.'
        user_metadata:
          type: object
          additionalProperties: true
          description: Caller-owned metadata (the `data` field on signup/update).
        factors:
          type: array
          description: |
            The user's MFA factors. Loaded on `GET /user` and after an MFA verify; absent when the
            user has none.
          items:
            $ref: '#/components/schemas/Factor'
        identities:
          type: array
          items:
            $ref: '#/components/schemas/Identity'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        banned_until:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
        is_anonymous:
          type: boolean
      required:
        - id
        - aud
        - role
        - email
        - phone
        - app_metadata
        - user_metadata
        - identities
        - created_at
        - updated_at
        - is_anonymous

    AccessTokenResponse:
      type: object
      title: AccessTokenResponse
      description: |
        The gotrue session envelope, returned by `/signup`, every `/token` grant, `POST /verify`,
        the passkey login and the MFA verify.
      properties:
        access_token:
          type: string
          description: |
            Signed JWT (ES256, or HS256 on the legacy path) carrying `sub`, `role`, `email`, `aud`,
            `exp` and the custom claims `session_id`, `aal`, `amr`, `app_metadata`,
            `user_metadata`, `phone`, `is_anonymous`. `iss` is present only when `JWT_ISSUER` is
            configured.
        token_type:
          type: string
          const: bearer
        expires_in:
          type: integer
          description: Access-token lifetime in seconds (`JWT_EXP`).
          examples: [3600]
        expires_at:
          type: integer
          format: int64
          description: Absolute expiry as a Unix timestamp (seconds).
        refresh_token:
          type: string
          description: Opaque 12-character `[a-z0-9]` token. Rotated on every refresh.
          examples: [k3n8x1q7pz0d]
        user:
          $ref: '#/components/schemas/User'
        provider_token:
          type: string
          description: |
            The external provider's access token. Present only on the PKCE exchange that follows an
            external OAuth flow; the implicit flow puts it in the redirect fragment instead.
        provider_refresh_token:
          type: string
          description: The provider's refresh token, when it issued one.
      required: [access_token, token_type, expires_in, expires_at, refresh_token, user]

    AdminListUsersResponse:
      type: object
      title: AdminListUsersResponse
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
        aud:
          type: string
          description: Deprecated upstream, still emitted.
      required: [users, aud]

    CaptchaOnlyParams:
      type: object
      title: CaptchaOnlyParams
      description: |
        A body whose only meaningful field is the CAPTCHA token. Every unauthenticated credential
        surface accepts the same `gotrue_meta_security` object when
        `SECURITY_CAPTCHA_ENABLED=true`.
      properties:
        gotrue_meta_security:
          $ref: '#/components/schemas/GotrueMetaSecurity'

    GotrueMetaSecurity:
      type: object
      title: GotrueMetaSecurity
      description: |
        Where the CAPTCHA token rides. Verified against hCaptcha or Turnstile per
        `SECURITY_CAPTCHA_PROVIDER`; a failure is `422 captcha_failed`. Ignored when CAPTCHA is off.
      properties:
        captcha_token:
          type: string
      required: [captcha_token]

    SignupParams:
      type: object
      title: SignupParams
      description: |
        `POST /signup`. Supply `email`, or `phone`, or neither (anonymous) — never both.
      properties:
        email:
          type: string
          format: email
          description: Lower-cased and trimmed.
        phone:
          type: string
          description: |
            E.164. Normalised before use. Requires `DILION_AUTH_EXTERNAL_PHONE_ENABLED=true`.
          examples: ['+821012345678']
        password:
          type: string
          maxLength: 72
          description: |
            Required for both the email and the phone flow (upstream allows an empty phone
            password; Dilion does not). Length floor is `PASSWORD_MIN_LENGTH` (default 6); the
            ceiling is bcrypt's 72 bytes.
        data:
          type: object
          additionalProperties: true
          description: Stored verbatim as the new user's `user_metadata`.
        channel:
          type: string
          enum: [sms, whatsapp]
          default: sms
          description: Phone flow only. `whatsapp` needs a Twilio content template.
        code_challenge:
          type: string
          description: Turns a confirmation-required **email** signup into a PKCE flow.
        code_challenge_method:
          type: string
          enum: [s256, plain]
        gotrue_meta_security:
          $ref: '#/components/schemas/GotrueMetaSecurity'

    PasswordGrantParams:
      type: object
      title: PasswordGrantParams
      description: Body for `POST /auth/v1/token?grant_type=password`.
      properties:
        email:
          type: string
          format: email
        phone:
          type: string
          description: Alternative to `email`. Needs the phone provider enabled and confirmed.
        password:
          type: string
        gotrue_meta_security:
          $ref: '#/components/schemas/GotrueMetaSecurity'
      required: [password]

    RefreshTokenGrantParams:
      type: object
      title: RefreshTokenGrantParams
      description: Body for `POST /auth/v1/token?grant_type=refresh_token`.
      properties:
        refresh_token:
          type: string
          minLength: 12
          description: Anything shorter than 12 characters answers `400 validation_failed`.
      required: [refresh_token]

    PKCEGrantParams:
      type: object
      title: PKCEGrantParams
      description: Body for `POST /auth/v1/token?grant_type=pkce`.
      properties:
        auth_code:
          type: string
          format: uuid
          description: The `code` the redirect handed back. Single-use.
        code_verifier:
          type: string
          description: |
            The verifier whose `code_challenge_method` transform equals the challenge the flow was
            created with. A mismatch is `400 bad_code_verifier`.
      required: [auth_code, code_verifier]

    IDTokenGrantParams:
      type: object
      title: IDTokenGrantParams
      description: |
        Body for `POST /auth/v1/token?grant_type=id_token`. Either `provider`, or `client_id` +
        `issuer` for a custom OIDC issuer.
      properties:
        id_token:
          type: string
          description: The provider-issued ID token to verify.
        access_token:
          type: string
          description: |
            The matching access token. When present, the `at_hash` claim is checked against it.
        nonce:
          type: string
          description: |
            Must equal the token's `nonce` unless `EXTERNAL_<PROVIDER>_SKIP_NONCE_CHECK` is set.
        provider:
          type: string
          description: '`apple`, `google`, `github` or `kakao`.'
        client_id:
          type: string
          description: With `issuer`, addresses a custom OIDC provider.
        issuer:
          type: string
        link_identity:
          type: boolean
          description: |
            Link the verified identity onto the caller's account instead of resolving one. Requires
            an `Authorization` header carrying a user access token.
      required: [id_token]

    UserUpdateParams:
      type: object
      title: UserUpdateParams
      description: |
        Body for `PUT /auth/v1/user`. Every field is optional; omit what you do not change.
      properties:
        email:
          type: string
          format: email
        phone:
          type: string
          description: |
            E.164. Requires the phone provider; applied at once with `SMS_AUTOCONFIRM`, otherwise
            parked in `new_phone` pending an OTP.
        password:
          type: string
          maxLength: 72
          description: Changing it revokes every **other** session of this user.
        nonce:
          type: string
          description: |
            The reauthentication code from `GET /reauthenticate`, required for a password change
            when `SECURITY_UPDATE_PASSWORD_REQUIRE_REAUTHENTICATION` is on and the session is
            older than 24 hours.
        data:
          type: object
          additionalProperties: true
          description: Merged into `user_metadata`; a `null` value deletes that key.
        app_metadata:
          type: object
          additionalProperties: true
          description: Parsed but ignored here — a user may not escalate their own claims.
        channel:
          type: string
          enum: [sms, whatsapp]
          default: sms
        code_challenge:
          type: string
        code_challenge_method:
          type: string
          enum: [s256, plain]
        redirect_to:
          type: string
          format: uri
          description: Overrides the `redirect_to` query parameter for the confirmation mail.

    VerifyParams:
      type: object
      title: VerifyParams
      description: |
        Body for `POST /auth/v1/verify`. Send **either** `token_hash` alone, or `token` with
        exactly one of `email` / `phone`.
      properties:
        type:
          type: string
          enum: [signup, invite, magiclink, recovery, email_change, sms, phone_change]
        token:
          type: string
          description: The plain OTP the user typed. Requires `email` or `phone` alongside it.
        token_hash:
          type: string
          description: |
            The hashed token from a link. Sending `email`, `phone` or `redirect_to` alongside it is
            `400 validation_failed`.
        email:
          type: string
          format: email
        phone:
          type: string
        redirect_to:
          type: string
          format: uri
        gotrue_meta_security:
          $ref: '#/components/schemas/GotrueMetaSecurity'
      required: [type]

    OtpParams:
      type: object
      title: OtpParams
      description: Body for `POST /auth/v1/otp`. Exactly one of `email` / `phone`.
      properties:
        email:
          type: string
          format: email
        phone:
          type: string
        create_user:
          type: boolean
          default: true
          description: |
            **Defaults to true**: an unknown identifier is signed up. `false` restricts sending to
            existing accounts (`422 otp_disabled` otherwise).
        data:
          type: object
          additionalProperties: true
          description: '`user_metadata` for an account created by this call.'
        channel:
          type: string
          enum: [sms, whatsapp]
          default: sms
          description: Phone only — sending it with an email is `400 validation_failed`.
        code_challenge:
          type: string
        code_challenge_method:
          type: string
          enum: [s256, plain]
        redirect_to:
          type: string
          format: uri
          description: |
            Not an upstream body field (upstream reads it from the query string), accepted here
            because several client libraries send it in the body.
        gotrue_meta_security:
          $ref: '#/components/schemas/GotrueMetaSecurity'

    MagicLinkParams:
      type: object
      title: MagicLinkParams
      description: Body for `POST /auth/v1/magiclink`.
      properties:
        email:
          type: string
          format: email
        data:
          type: object
          additionalProperties: true
        code_challenge:
          type: string
        code_challenge_method:
          type: string
          enum: [s256, plain]
        redirect_to:
          type: string
          format: uri
        gotrue_meta_security:
          $ref: '#/components/schemas/GotrueMetaSecurity'
      required: [email]

    RecoverParams:
      type: object
      title: RecoverParams
      description: Body for `POST /auth/v1/recover`.
      properties:
        email:
          type: string
          format: email
        code_challenge:
          type: string
        code_challenge_method:
          type: string
          enum: [s256, plain]
        redirect_to:
          type: string
          format: uri
        gotrue_meta_security:
          $ref: '#/components/schemas/GotrueMetaSecurity'
      required: [email]

    ResendParams:
      type: object
      title: ResendParams
      description: Body for `POST /auth/v1/resend`.
      properties:
        type:
          type: string
          enum: [signup, email_change, sms, phone_change]
        email:
          type: string
          format: email
          description: Required for `signup` / `email_change` — the account's **current** address.
        phone:
          type: string
          description: Required for `sms` / `phone_change`.
        code_challenge:
          type: string
        code_challenge_method:
          type: string
          enum: [s256, plain]
        redirect_to:
          type: string
          format: uri
        gotrue_meta_security:
          $ref: '#/components/schemas/GotrueMetaSecurity'
      required: [type]

    InviteParams:
      type: object
      title: InviteParams
      description: Body for `POST /auth/v1/invite`.
      properties:
        email:
          type: string
          format: email
        data:
          type: object
          additionalProperties: true
          description: '`user_metadata` for the account this creates.'
        redirect_to:
          type: string
          format: uri
      required: [email]

    GenerateLinkParams:
      type: object
      title: GenerateLinkParams
      description: Body for `POST /auth/v1/admin/generate_link`.
      properties:
        type:
          type: string
          enum: [signup, invite, magiclink, recovery, email_change_current, email_change_new]
        email:
          type: string
          format: email
        new_email:
          type: string
          format: email
          description: Required for the `email_change_*` types.
        password:
          type: string
          maxLength: 72
          description: '`signup` only — sets the password of the account this creates.'
        data:
          type: object
          additionalProperties: true
        redirect_to:
          type: string
          format: uri
      required: [type, email]

    GenerateLinkResponse:
      title: GenerateLinkResponse
      description: |
        The user object **flattened together with** the generated link and its token — upstream
        embeds `User` rather than nesting it.
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            action_link:
              type: string
              format: uri
              description: The full URL to mail — `<site>/auth/v1/verify?token=…&type=…&redirect_to=…`.
            email_otp:
              type: string
              description: The plain OTP behind the link, for a client that prompts instead of links.
            hashed_token:
              type: string
              description: What `POST /verify` accepts as `token_hash`.
            verification_type:
              type: string
              description: The resolved type — a `magiclink` for an unknown address becomes `signup`.
            redirect_to:
              type: string
              format: uri
              description: The allow-list-validated redirect baked into `action_link`.
          required: [action_link, email_otp, hashed_token, verification_type, redirect_to]

    ExternalCallbackForm:
      type: object
      title: ExternalCallbackForm
      description: |
        The `response_mode=form_post` body Apple sends to `POST /auth/v1/callback`.
      properties:
        state:
          type: string
          format: uuid
          description: The flow-state id issued by `/authorize`.
        code:
          type: string
        user:
          type: string
          description: |
            Apple only: a JSON blob with the user's name, sent on the **first** authorization and
            never again.
        error:
          type: string
        error_description:
          type: string
      required: [state]

    SamlAcsForm:
      type: object
      title: SamlAcsForm
      description: The IdP's POST binding to `/auth/v1/sso/saml/acs`.
      properties:
        SAMLResponse:
          type: string
          description: The base64-encoded, signed SAML response.
        RelayState:
          type: string
          description: |
            The relay-state UUID for an SP-initiated flow, or a URL / empty for an IdP-initiated
            one.
      required: [SAMLResponse]

    Factor:
      type: object
      title: Factor
      description: An MFA factor. `user_id` and the TOTP secret are never serialized.
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [unverified, verified]
          description: |
            `unverified` factors are swept 5 minutes after enrollment and never raise `aal`.
        friendly_name:
          type: string
          description: Unique per user. Omitted when empty.
        factor_type:
          type: string
          enum: [totp, phone, webauthn]
          description: Only `totp` can actually be enrolled here.
        phone:
          type: string
          description: Always empty — phone factors are not implemented.
        last_challenged_at:
          type: ['string', 'null']
          format: date-time
      required: [id, created_at, updated_at, status, factor_type, phone, last_challenged_at]

    EnrollFactorParams:
      type: object
      title: EnrollFactorParams
      properties:
        factor_type:
          type: string
          enum: [totp, phone, webauthn]
          description: '`phone` and `webauthn` answer `422 mfa_*_enroll_not_enabled`.'
        friendly_name:
          type: string
          description: Must be unique among this user's factors.
        issuer:
          type: string
          description: |
            The issuer baked into the `otpauth://` URI. Defaults to the host of `SITE_URL`.
        phone:
          type: string
          description: Accepted for upstream compatibility; phone factors are not implemented.
      required: [factor_type]

    TOTPObject:
      type: object
      title: TOTPObject
      properties:
        qr_code:
          type: string
          description: An inline **SVG** of the `otpauth://` URI.
        secret:
          type: string
          description: The base32 TOTP secret, for manual entry.
        uri:
          type: string
          description: The `otpauth://totp/...` URI.

    EnrollFactorResponse:
      type: object
      title: EnrollFactorResponse
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          examples: [totp]
        friendly_name:
          type: string
        totp:
          $ref: '#/components/schemas/TOTPObject'
        phone:
          type: string
      required: [id, type, friendly_name]

    ChallengeFactorParams:
      type: object
      title: ChallengeFactorParams
      properties:
        channel:
          type: string
          description: |
            Phone factors only, which do not exist here — accepted and unused for TOTP.

    ChallengeFactorResponse:
      type: object
      title: ChallengeFactorResponse
      properties:
        id:
          type: string
          format: uuid
          description: The `challenge_id` to send to `.../verify`.
        type:
          type: string
          examples: [totp]
        expires_at:
          type: integer
          format: int64
          description: Unix seconds — 5 minutes out.
      required: [id, type]

    VerifyFactorParams:
      type: object
      title: VerifyFactorParams
      properties:
        challenge_id:
          type: string
          format: uuid
        code:
          type: string
          description: The 6-digit TOTP code. One period of skew is tolerated.
      required: [challenge_id, code]

    UnenrollFactorResponse:
      type: object
      title: UnenrollFactorResponse
      properties:
        id:
          type: string
          format: uuid
      required: [id]

    AdminUpdateFactorParams:
      type: object
      title: AdminUpdateFactorParams
      properties:
        friendly_name:
          type: string
        phone:
          type: string
          description: Accepted and ignored.

    PasskeyRegistrationOptionsResponse:
      type: object
      title: PasskeyRegistrationOptionsResponse
      properties:
        challenge_id:
          type: string
          format: uuid
        options:
          type: object
          additionalProperties: true
          description: |
            The WebAuthn `PublicKeyCredentialCreationOptions` — pass straight to
            `navigator.credentials.create({publicKey})`. Attestation preference is `none`, and the
            user's existing credentials are listed under `excludeCredentials`.
        expires_at:
          type: integer
          format: int64
          description: Unix seconds — 5 minutes out.
      required: [challenge_id, options, expires_at]

    PasskeyAuthenticationOptionsResponse:
      type: object
      title: PasskeyAuthenticationOptionsResponse
      properties:
        challenge_id:
          type: string
          format: uuid
        options:
          type: object
          additionalProperties: true
          description: |
            The WebAuthn `PublicKeyCredentialRequestOptions` — pass straight to
            `navigator.credentials.get({publicKey})`. No `allowCredentials`: the ceremony is
            discoverable, so the authenticator picks the account.
        expires_at:
          type: integer
          format: int64
      required: [challenge_id, options, expires_at]

    PasskeyVerifyParams:
      type: object
      title: PasskeyVerifyParams
      description: |
        Used by both `/passkeys/registration/verify` and `/passkeys/authentication/verify`.
      properties:
        challenge_id:
          type: string
          format: uuid
        credential:
          type: object
          additionalProperties: true
          description: |
            The raw credential the browser produced — the attestation response for registration,
            the assertion response for authentication — forwarded verbatim.
      required: [challenge_id, credential]

    PasskeyMetadataResponse:
      type: object
      title: PasskeyMetadataResponse
      description: What `/passkeys/registration/verify` returns for the newly stored credential.
      properties:
        id:
          type: string
          format: uuid
        friendly_name:
          type: string
        created_at:
          type: string
          format: date-time
      required: [id, created_at]

    PasskeyListItem:
      type: object
      title: PasskeyListItem
      description: |
        Passkey metadata. The public key, sign count and AAGUID never leave the server.
      properties:
        id:
          type: string
          format: uuid
        friendly_name:
          type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
      required: [id, created_at]

    PasskeyUpdateParams:
      type: object
      title: PasskeyUpdateParams
      properties:
        friendly_name:
          type: string
          maxLength: 120
      required: [friendly_name]

    SingleSignOnParams:
      type: object
      title: SingleSignOnParams
      description: Body for `POST /auth/v1/sso`. Exactly one of `provider_id` / `domain`.
      properties:
        provider_id:
          type: string
          format: uuid
        domain:
          type: string
          description: An email domain claimed by a registered provider.
          examples: [example.com]
        redirect_to:
          type: string
          format: uri
        skip_http_redirect:
          type: boolean
          description: '`true` returns `{"url": …}` instead of a 303.'
        code_challenge:
          type: string
        code_challenge_method:
          type: string
          enum: [s256, plain]
        gotrue_meta_security:
          $ref: '#/components/schemas/GotrueMetaSecurity'

    SingleSignOnResponse:
      type: object
      title: SingleSignOnResponse
      properties:
        url:
          type: string
          format: uri
          description: The IdP URL to navigate to.
      required: [url]

    SAMLAttribute:
      type: object
      title: SAMLAttribute
      description: How one user field is read out of the assertion.
      properties:
        name:
          type: string
          description: A single assertion attribute name.
        names:
          type: array
          description: Several candidates, tried in order.
          items:
            type: string
        default:
          description: Used when no candidate is present.
        array:
          type: boolean
          description: Keep every value rather than the first.

    SAMLAttributeMapping:
      type: object
      title: SAMLAttributeMapping
      properties:
        keys:
          type: object
          description: |
            User field → attribute rule. `email` is the one the ACS insists on
            (`saml_assertion_no_email` otherwise).
          additionalProperties:
            $ref: '#/components/schemas/SAMLAttribute'

    SSODomain:
      type: object
      title: SSODomain
      properties:
        domain:
          type: string
      required: [domain]

    SAMLProvider:
      type: object
      title: SAMLProvider
      properties:
        entity_id:
          type: string
          description: Read out of the metadata; immutable once registered.
        metadata_xml:
          type: string
          description: Stripped from list rows; present when reading one provider.
        metadata_url:
          type: string
          format: uri
        attribute_mapping:
          $ref: '#/components/schemas/SAMLAttributeMapping'
        name_id_format:
          type: string
      required: [entity_id]

    SSOProvider:
      type: object
      title: SSOProvider
      properties:
        id:
          type: string
          format: uuid
        resource_id:
          type: string
          description: Operator-chosen alias; addressable as `resource_<id>` in the path.
        disabled:
          type: ['boolean', 'null']
        saml:
          $ref: '#/components/schemas/SAMLProvider'
        domains:
          type: array
          items:
            $ref: '#/components/schemas/SSODomain'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, disabled, domains, created_at, updated_at]

    SSOProviderListResponse:
      type: object
      title: SSOProviderListResponse
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SSOProvider'
      required: [items]

    CreateSSOProviderParams:
      type: object
      title: CreateSSOProviderParams
      description: |
        Body for creating **and** updating an SSO provider. On update every field is optional and
        `type` may be omitted.
      properties:
        type:
          type: string
          enum: [saml]
        metadata_url:
          type: string
          format: uri
          description: Must be HTTPS. Mutually exclusive with `metadata_xml`.
        metadata_xml:
          type: string
        domains:
          type: array
          description: Email domains routed to this provider. Replaces the set on update.
          items:
            type: string
        attribute_mapping:
          $ref: '#/components/schemas/SAMLAttributeMapping'
        name_id_format:
          type: string
          description: Unspecified, or one of the four supported NameID formats.
        resource_id:
          type: string
        disabled:
          type: boolean

    AuthorizeParams:
      type: object
      title: AuthorizeParams
      description: The form body of `POST /auth/v1/oauth/authorize`.
      properties:
        client_id:
          type: string
          format: uuid
        redirect_uri:
          type: string
        response_type:
          type: string
          enum: [code]
        scope:
          type: string
        state:
          type: string
        resource:
          type: string
        code_challenge:
          type: string
        code_challenge_method:
          type: string
        nonce:
          type: string
      required: [client_id, redirect_uri]

    OAuthClientRegisterParams:
      type: object
      title: OAuthClientRegisterParams
      properties:
        redirect_uris:
          type: array
          maxItems: 10
          items:
            type: string
        client_type:
          type: string
          enum: [public, confidential]
          description: Inferred from `token_endpoint_auth_method` when omitted.
        token_endpoint_auth_method:
          type: string
          enum: [client_secret_basic, client_secret_post, none]
        grant_types:
          type: array
          description: 'Defaults to `["authorization_code", "refresh_token"]`.'
          items:
            type: string
        client_name:
          type: string
        client_uri:
          type: string
        logo_uri:
          type: string
      required: [redirect_uris]

    OAuthClientUpdateParams:
      type: object
      title: OAuthClientUpdateParams
      description: |
        Sparse update — only the keys present are applied, and an empty body is
        `400 validation_failed`. `client_type` cannot be changed.
      properties:
        redirect_uris:
          type: array
          items:
            type: string
        grant_types:
          type: array
          items:
            type: string
        client_name:
          type: string
        client_uri:
          type: string
        logo_uri:
          type: string
        token_endpoint_auth_method:
          type: string
          enum: [client_secret_basic, client_secret_post, none]

    OAuthClientResponse:
      type: object
      title: OAuthClientResponse
      properties:
        client_id:
          type: string
          format: uuid
        client_secret:
          type: string
          description: |
            Returned **only** on registration and on regenerate — the server stores a hash.
        client_type:
          type: string
          enum: [public, confidential]
        redirect_uris:
          type: array
          items:
            type: string
        token_endpoint_auth_method:
          type: string
        grant_types:
          type: array
          items:
            type: string
        response_types:
          type: array
          items:
            type: string
        client_name:
          type: string
        client_uri:
          type: string
        logo_uri:
          type: string
        registration_type:
          type: string
          enum: [manual, dynamic]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [client_id, client_type]

    OAuthClientListResponse:
      type: object
      title: OAuthClientListResponse
      properties:
        clients:
          type: array
          items:
            $ref: '#/components/schemas/OAuthClientResponse'

    OAuthTokenParams:
      type: object
      title: OAuthTokenParams
      description: |
        `POST /auth/v1/oauth/token`, as form fields or JSON. `client_id` / `client_secret` are only
        needed when the credentials are not in an HTTP Basic header.
      properties:
        grant_type:
          type: string
          enum: [authorization_code, refresh_token]
        code:
          type: string
          description: '`authorization_code` only.'
        refresh_token:
          type: string
          description: '`refresh_token` only.'
        redirect_uri:
          type: string
          description: When sent, must equal the one the authorization was created with.
        client_id:
          type: string
        client_secret:
          type: string
        code_verifier:
          type: string
          description: Required when the authorization carried a `code_challenge`.
        resource:
          type: string
      required: [grant_type]

    OAuthTokenResponse:
      type: object
      title: OAuthTokenResponse
      description: |
        RFC 6749 token response. Note it is **not** the gotrue session envelope: no `user`, no
        `expires_at`.
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: bearer
        expires_in:
          type: integer
        refresh_token:
          type: string
        id_token:
          type: string
          description: Present only when the authorization carried the `openid` scope.
      required: [access_token, token_type, expires_in, refresh_token]

    ClientDetails:
      type: object
      title: ClientDetails
      description: The client block the consent page and the grant list render.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        uri:
          type: string
        logo_uri:
          type: string
      required: [id]

    UserDetails:
      type: object
      title: UserDetails
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string

    AuthorizationDetailsResponse:
      type: object
      title: AuthorizationDetailsResponse
      description: What the consent page renders.
      properties:
        authorization_id:
          type: string
        redirect_uri:
          type: string
        client:
          $ref: '#/components/schemas/ClientDetails'
        user:
          $ref: '#/components/schemas/UserDetails'
        scope:
          type: string
          description: Space-separated scopes being requested.
      required: [authorization_id]

    ConsentRequest:
      type: object
      title: ConsentRequest
      properties:
        action:
          type: string
          enum: [approve, deny]
      required: [action]

    ConsentResponse:
      type: object
      title: ConsentResponse
      description: |
        Where the consent page must send the browser — the client's `redirect_uri` with `?code=`
        and `?state=` on approval, or `?error=access_denied` on denial.
      properties:
        redirect_url:
          type: string
          format: uri

    UserOAuthGrantResponse:
      type: object
      title: UserOAuthGrantResponse
      properties:
        client:
          $ref: '#/components/schemas/ClientDetails'
        scopes:
          type: array
          items:
            type: string
        granted_at:
          type: string
          format: date-time
      required: [client, scopes, granted_at]

    UserInfoResponse:
      type: object
      title: UserInfoResponse
      description: |
        OIDC UserInfo claims. Only `sub` is guaranteed; everything else depends on the scopes the
        session was granted.
      properties:
        sub:
          type: string
          format: uuid
        email:
          type: string
        email_verified:
          type: boolean
        name:
          type: string
          description: '`user_metadata.name`, falling back to the email.'
        picture:
          type: string
          description: '`user_metadata.picture`, falling back to `avatar_url`.'
        preferred_username:
          type: string
        updated_at:
          type: integer
          format: int64
          description: Unix seconds.
        user_metadata:
          type: object
          additionalProperties: true
        phone:
          type: string
        phone_verified:
          type: boolean
      required: [sub]

    AuditLogEntry:
      type: object
      title: AuditLogEntry
      description: |
        One row of `GET /auth/v1/admin/audit` — a `dilion_audit.events` record projected into
        upstream's `auth.audit_log_entries` body.
      properties:
        id:
          type: string
          format: uuid
        payload:
          type: object
          description: |
            `actor_id`, `actor_username` (always empty), `actor_via_sso` (always false), `action`,
            `log_type`, and a `traits` object carrying Dilion's own fields — `resource`,
            `access_level`, `reason`, `actor_type`, `request_id`, `user_agent`, `result_count`,
            `subject_count`.
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        ip_address:
          type: string
      required: [id, payload, created_at, ip_address]

    AdminUserParams:
      type: object
      title: AdminUserParams
      description: Body for `POST /auth/v1/admin/users` and `PUT /auth/v1/admin/users/{user_id}`.
      properties:
        id:
          type: string
          format: uuid
          description: Create only — pick the new user's UUID. Generated when omitted.
        aud:
          type: string
          description: Create only. Defaults to `X-JWT-AUD` or `authenticated`.
        role:
          type: string
          description: Defaults to `authenticated` on create.
        email:
          type: string
          format: email
        phone:
          type: string
          description: Rejected on create — the admin path has no phone branch.
        password:
          type: string
          maxLength: 72
          description: |
            Create: optional (a user without a password cannot use the password grant).
            Update: setting it revokes all of that user's sessions; `""` clears the password.
        email_confirm:
          type: boolean
          description: Marks the address confirmed (and drives `identity_data.email_verified`).
        phone_confirm:
          type: boolean
          description: Accepted and ignored.
        user_metadata:
          type: object
          additionalProperties: true
          description: Replaces on create, merges on update (a `null` value deletes the key).
        app_metadata:
          type: object
          additionalProperties: true
          description: |
            Merged over `{"provider":"email","providers":["email"]}` on create; merges on update.
        ban_duration:
          type: string
          description: |
            A Go duration (`"24h"`, `"720h"`) sets `banned_until` and revokes the user's sessions;
            `"none"` lifts a ban.
          examples: ['24h']

    AdminUserDeleteParams:
      type: object
      title: AdminUserDeleteParams
      description: Optional body for `DELETE /auth/v1/admin/users/{user_id}`.
      properties:
        should_soft_delete:
          type: boolean
          default: false
