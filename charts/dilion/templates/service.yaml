apiVersion: v1
kind: Service
metadata:
  name: {{ include "dilion.fullname" . }}
  labels:
    {{- include "dilion.labels" . | nindent 4 }}
    {{- with .Values.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "dilion.selectorLabels" . | nindent 4 }}
{{- if .Values.metrics.enabled }}
---
# Metrics have a ClusterIP Service of their own so that a public API Service
# (LoadBalancer, NodePort) never carries them, and so the ServiceMonitor can
# select exactly this one.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dilion.fullname" . }}-metrics
  labels:
    {{- include "dilion.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
    {{- with .Values.metrics.service.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.metrics.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "dilion.selectorLabels" . | nindent 4 }}
{{- end }}
