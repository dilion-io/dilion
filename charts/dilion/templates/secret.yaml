{{- include "dilion.validateSecrets" . }}
{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dilion.fullname" . }}
  labels:
    {{- include "dilion.labels" . | nindent 4 }}
type: Opaque
stringData:
  DILION_DSN: {{ .Values.secrets.dsn | quote }}
  DILION_MASTER_KEY: {{ .Values.secrets.masterKey | quote }}
  {{- with .Values.secrets.jwtSecret }}
  DILION_JWT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.jwtKeys }}
  DILION_AUTH_JWT_KEYS: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.opaqueMasterKey }}
  DILION_AUTH_OPAQUE_MASTER_KEY: {{ . | quote }}
  {{- end }}
  {{- range $k, $v := .Values.secrets.extra }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
{{- end }}
