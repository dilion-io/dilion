apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dilion.fullname" . }}
  labels:
    {{- include "dilion.labels" . | nindent 4 }}
data:
  {{- range $k, $v := .Values.config }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
{{- if include "dilion.hasFiles" . }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dilion.fullname" . }}-files
  labels:
    {{- include "dilion.labels" . | nindent 4 }}
data:
  {{- with .Values.policy }}
  policy.yaml: |
    {{- . | nindent 4 }}
  {{- end }}
  {{- with .Values.piiFields }}
  pii-fields.yaml: |
    {{- . | nindent 4 }}
  {{- end }}
{{- end }}
